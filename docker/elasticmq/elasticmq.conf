# ElasticMQ(開発用の SQS 互換サーバー)の設定 → docs/superpowers/specs/2026-10-11-phase20-sqs-auth-mail-design.md の決定7
# 起動時にここに書いたキューが作られる。本番のキューは cloudformation/app.yml が作り、値もそちらが正。
# ここの値は本番と揃えているが、ElasticMQ は本物の SQS とは別の実装なので、挙動の細部は stg で確かめる。
include classpath("application.conf")

# 応答に含まれるキュー URL のホスト部分。コンテナ間では elasticmq という名前で届く
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # 本物の SQS と同じ制約(メッセージの大きさ、受信件数の上限など)で検査する
  sqs-limits = strict
}

queues {
  # 認証メールの送信依頼。Web が送り、ワーカーが受け取る
  auth-mail {
    # 受け取ってから 60 秒以内に削除しないと、再び配信される(決定10)
    defaultVisibilityTimeout = 60 seconds
    # 5 回受け取られても削除されなければ DLQ に移る(決定10)
    deadLettersQueue {
      name = "auth-mail-dlq"
      maxReceiveCount = 5
    }
  }
  auth-mail-dlq {}

  # テスト専用(MySQL の app_test と同じく、同じコンテナで名前を分ける → docs/test/README.md)。
  # DLQ は付けない。受信ループのテストは「削除されたか / 残っているか」だけを見る
  auth-mail-test {
    defaultVisibilityTimeout = 60 seconds
  }
}
