# OIDC の AssumeRole が失敗する原因を切り分けるための一時的なワークフロー。
#
# 原因が分かったら削除する。恒久的に置くものではない。
#
# 「Not authorized to perform sts:AssumeRoleWithWebIdentity」は
#   ① 信頼ポリシーの条件(sub / aud)が実行時のトークンと合っていない
#   ② role-to-assume に渡した ARN が別のロールを指している
#   ③ 信頼ポリシーが参照している OIDC プロバイダが存在しない
# のいずれかで出る。②③ は AWS 側の確認、① はこのワークフローで実際のクレームを見て突き合わせる。
#
# 【重要】pull_request トリガーを足してはいけない(ecr-push.yml と同じ理由)。
name: OIDC のデバッグ(一時)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      # Secret そのものはログで *** にマスクされるが、長さや部分文字列は出せる。
      # 末尾の改行・前後の空白・貼り間違いはここでほぼ判別できる。
      - name: Secret に入っている ARN の形を確かめる
        env:
          ARN: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
        run: |
          echo "長さ: ${#ARN}  (期待: 62)"
          echo "先頭: ${ARN:0:13}  (期待: arn:aws:iam::)"
          echo "アカウント: $(echo "$ARN" | cut -d: -f5)  (期待: 247064999676)"
          echo "リソース部: $(echo "$ARN" | cut -d: -f6)  (期待: role/nuxt-java-practice-gha-ecr-push)"
          case "$ARN" in
            *[[:space:]]*) echo "::error::ARN に空白または改行が含まれている" ;;
            "") echo "::error::Secret が空。名前が AWS_ECR_PUSH_ROLE_ARN になっているか確認する" ;;
            *) echo "空白文字は含まれていない" ;;
          esac

      # トークンの署名は見せず、ペイロード(クレーム)だけをデコードして出す。
      # クレームは秘密ではない(改ざんを防いでいるのは署名のほう)。
      - name: OIDC トークンのクレームを見る
        run: |
          token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          # JWT は header.payload.signature。2 番目だけ取り出す。
          payload=$(echo "$token" | cut -d. -f2)
          # base64url を base64 に直し、4 の倍数になるよう = を足す
          padded="${payload//-/+}"; padded="${padded//_//}"
          while [ $(( ${#padded} % 4 )) -ne 0 ]; do padded="${padded}="; done

          echo "----- 信頼ポリシーが見ているクレーム -----"
          echo "$padded" | base64 -d | jq '{iss, aud, sub, repository, ref, workflow_ref}'
          echo "-----------------------------------------"
          echo "sub が repo:0000masa/nuxt-java-practice:* に一致し、"
          echo "aud が sts.amazonaws.com、iss が https://token.actions.githubusercontent.com なら"
          echo "信頼ポリシーの条件側は問題ない(= 原因は ARN か OIDC プロバイダのほう)。"

      - name: AssumeRole を試す
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: 成功したら誰になれたか出す
        run: aws sts get-caller-identity
