# CloudFormation スタックに変更を反映する(フェーズ13 の追補)。
#
# 設計 → docs/superpowers/specs/2026-08-19-phase13-cloudformation-design.md の決定20
# 経緯 → docs/adr/0007-app-deploy-inside-cloudformation.md
#        docs/adr/0009-cfn-apply-as-the-single-cloudformation-caller.md
# 手順書 → docs/infrastructure/cloudformation-operations.md の §9
#
# 【このリポジトリで CloudFormation を叩く唯一の場所】
# aws cloudformation の呼び出しはこのファイルにしか無い。cfn-deploy.yml(構築)は
# 順序を表現するだけで、実際の作成と更新は workflow_call でここへ委譲する(→ ADR-0009)。
#
# 【dispatch と workflow_call で挙動が違う】
# Actions の UI から叩いたときにできるのは「既存スタックの更新」だけ。スタックが無い場合と
# WebDesiredCount が 0 の場合は precheck が弾く。この 2 つを開ける入力
# (web_desired_count / allow_missing_stack / allow_zero_desired_count)は
# workflow_call にしか宣言していない。人間が UI から解除する手段が無いことが安全弁になる。
#
# 開ける必要があるのは構築フロー(cfn-deploy.yml)だけで、理由は次の 2 つ。
#   1 段目: スタックがまだ無い。かつ WebDesiredCount=0 で作る
#   4 段目: スタックの現在の WebDesiredCount が 0(1 段目が入れた値)
# 2 つの guard のエラーメッセージはどちらも「cfn-deploy.yml を使ってください」と言っている。
# 呼び出し元が cfn-deploy 本人なら、その案内は意味を持たない。
#
# 【concurrency を持たない理由】
# 呼ばれる側のワークフローレベル concurrency も適用されるので、呼び出し側と同じグループ名を
# 持つと親子で枠を取り合って止まる。直列化は入口(cfn-deploy.yml / cfn-destroy.yml)が持つ。
# dispatch 時の保護は precheck が担う。cfn-deploy / cfn-destroy が走っている全期間、
# スタックは「進行中の状態」か「WebDesiredCount=0」のどちらかなので precheck が必ず弾く
# (対応表 → docs/adr/0009-cfn-apply-as-the-single-cloudformation-caller.md)。
#
# 【aws cloudformation deploy を使っていない理由】
# 既存環境を触るので「何が変わるか」を必ずジョブサマリに残したい。deploy は内部で Change Set を
# 作って即実行してしまい、差分を出す隙がない。代償として、deploy が暗黙にやっていた 3 つを
# 自分で書くことになる。
#   1. 渡さなかったパラメータを UsePreviousValue にする(→ ImageTag)
#   2. 51,200 バイトを超えるテンプレートを S3 経由にする(→ テンプレートを S3 に置くステップ)
#   3. スタックが無い / REVIEW_IN_PROGRESS なら CREATE、それ以外は UPDATE の Change Set にする
name: CloudFormation スタックを反映(更新のみ)

on:
  workflow_dispatch:
    inputs:
      env:
        description: 対象環境
        type: choice
        options: [stg]
        default: stg
      image_tag:
        description: ECR のイメージタグ。空にすると今デプロイされているタグを維持する
        type: string
        default: ""
      dry_run:
        description: Change Set を作って差分を見るだけで実行しない
        type: boolean
        default: false
      allow_replacement:
        description: リソースの作り直しを許可する(Replacement が True と Conditional の両方)。RDS が作り直されると中のデータは消える
        type: boolean
        default: false

  # 構築フロー(cfn-deploy.yml)から呼ばれるときの口。
  # 下 3 つは workflow_dispatch には宣言しない(上の【dispatch と workflow_call で挙動が違う】)。
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      # 構築では必ずタグを指定する。CREATE では UsePreviousValue にできる前の値が無い
      image_tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      allow_replacement:
        type: boolean
        default: false
      # params の WebDesiredCount を上書きする。空なら params の値をそのまま使う
      web_desired_count:
        type: string
        default: ""
      # スタックが無い(または REVIEW_IN_PROGRESS)ときに CREATE の Change Set を作る
      allow_missing_stack:
        type: boolean
        default: false
      # スタックの現在の WebDesiredCount が 0 でも続行する
      allow_zero_desired_count:
        type: boolean
        default: false
    # 呼び出し側がサマリを組み立てるために返す(→ cfn-deploy.yml の summary ジョブ)。
    # 差分ゼロ / dry_run / スキップのときは空文字で返る
    outputs:
      app_url:
        value: ${{ jobs.apply.outputs.app_url }}
      alb_dns:
        value: ${{ jobs.apply.outputs.alb_dns }}
      image_tag:
        value: ${{ jobs.apply.outputs.image_tag }}
      desired_count:
        value: ${{ jobs.apply.outputs.desired_count }}

env:
  AWS_REGION: ap-northeast-1
  TEMPLATE: cloudformation/app.yml

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}
    # 新規作成は RDS と NAT Gateway があるので 15〜25 分、ECS サービスの入れ替えを含む更新は
    # 10〜20 分。CLI の waiter は 30 秒 × 120 回 = 60 分で諦めるので、それを待ちきれる余裕を持たせる。
    timeout-minutes: 75
    outputs:
      app_url: ${{ steps.result.outputs.app_url }}
      alb_dns: ${{ steps.result.outputs.alb_dns }}
      image_tag: ${{ steps.result.outputs.image_tag }}
      desired_count: ${{ steps.result.outputs.desired_count }}

    steps:
      - uses: actions/checkout@v4

      - name: AWS に AssumeRole する(OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CFN_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 前提が崩れている状態で叩かれたときは、AWS の生のエラーではなく
      # 「代わりに何をすべきか」を出して落ちる。ついでに CREATE / UPDATE の判定もここで決める。
      - name: 前提を確かめる
        id: pre
        run: |
          set -euo pipefail
          stack="nuxt-java-practice-${{ inputs.env }}"
          echo "stack=$stack" >> "$GITHUB_OUTPUT"

          if json=$(aws cloudformation describe-stacks --stack-name "$stack" --output json 2>/dev/null); then
            status=$(echo "$json" | jq -r '.Stacks[0].StackStatus')
          else
            status=NOT_FOUND
          fi

          # REVIEW_IN_PROGRESS は「新規スタックに CreateChangeSet を撃ったが実行しなかった」跡で、
          # スタック ID だけがあってリソースは 1 つも無い(dry_run が必ずこれを残す)。
          # aws cloudformation deploy もこの状態を「スタックが無い」とみなして CREATE を
          # 作り直すので、同じ扱いにする(→ 手順書 §8)。
          case "$status" in
            NOT_FOUND|REVIEW_IN_PROGRESS)
              if [ "${{ inputs.allow_missing_stack }}" != "true" ]; then
                echo "::error::スタック $stack がありません($status)。初回構築は cfn-deploy.yml を使ってください"
                exit 1
              fi
              echo "type=CREATE" >> "$GITHUB_OUTPUT"
              echo "状態: $status → 新規作成(CREATE)"
              exit 0
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
            ROLLBACK_COMPLETE)
              echo "::error::状態が $status です。作成に失敗したスタックは更新できません。cfn-destroy.yml で削除してから建て直してください"
              exit 1 ;;
            UPDATE_ROLLBACK_FAILED)
              echo "::error::状態が $status です。continue-update-rollback をコンソールから実行して復帰させてください"
              exit 1 ;;
            *)
              echo "::error::状態が $status なので更新できません(進行中か、削除待ちの可能性があります)"
              exit 1 ;;
          esac

          # exit は「case の枝を抜ける」ではなく「シェルのプロセスを終了する」コマンドなので
          # CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETEの更新して良い状態のときだけこの部分に達する。
          echo "type=UPDATE" >> "$GITHUB_OUTPUT"

          # DesiredCount=0 は「cfn-deploy.yml が create-db-users / migrate の途中で止まった状態」。
          # ここで params の値(1 以上)を流し込むと、DB ユーザーがまだ無いままタスクが起動して
          # クラッシュループし、CloudFormation が最大 3 時間サービスの安定を待って失敗する。
          desired=$(echo "$json" | jq -r '.Stacks[0].Parameters[] | select(.ParameterKey == "WebDesiredCount") | .ParameterValue')
          if [ "$desired" = "0" ] && [ "${{ inputs.allow_zero_desired_count }}" != "true" ]; then
            echo "::error::スタックの WebDesiredCount が 0 です(create-db-users / migrate が未完了)。cfn-deploy.yml を実行してください"
            exit 1
          fi

          echo "状態: $status / WebDesiredCount: $desired → 更新(UPDATE)"

      # テンプレートが 51,200 バイト(リクエストに直接載せられる上限)を超えているため、
      # CloudFormation に渡す口が S3 しかない。TemplateURL は S3 か SSM ドキュメントのみで、
      # GitHub の raw URL は受け付けない(API リファレンスに明記)。
      # バケットは手動管理の常駐リソース(→ docs/adr/0008)。名前はアカウント ID から組み立てる。
      - name: テンプレートを S3 に置く
        id: tpl
        run: |
          set -euo pipefail
          account=$(aws sts get-caller-identity --query Account --output text)
          bucket="nuxt-java-practice-cfn-templates-${account}"
          key="templates/${GITHUB_SHA}/app.yml"

          aws s3 cp "$TEMPLATE" "s3://${bucket}/${key}" --only-show-errors
          echo "url=https://${bucket}.s3.${AWS_REGION}.amazonaws.com/${key}" >> "$GITHUB_OUTPUT"
          echo "s3://${bucket}/${key} に置きました($(wc -c < "$TEMPLATE") バイト)"

      - name: Change Set を作る
        id: cs
        env:
          CS_TYPE: ${{ steps.pre.outputs.type }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          WEB_DESIRED_COUNT: ${{ inputs.web_desired_count }}
          BASIC_AUTH_CREDENTIAL: ${{ secrets.BASIC_AUTH_CREDENTIAL }}
        run: |
          set -euo pipefail
          stack="${{ steps.pre.outputs.stack }}"
          name="apply-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          # 構築(CREATE)では ImageTag を省略できない。UsePreviousValue にできる前の値が無い
          if [ -z "$IMAGE_TAG" ] && [ "$CS_TYPE" = "CREATE" ]; then
            echo "::error::新規作成では image_tag を省略できません(UsePreviousValue にできる前の値が無い)"
            exit 1
          fi

          # params ファイルがパラメータの唯一の正。動的な 3 つを先頭に積み、unique_by で同じキーを潰す。
          # 残るのは先頭側なので、params に有る WebDesiredCount は上書き、無い 2 つは追記になる
          # (同じ ParameterKey が 2 つ並ぶと CloudFormation が弾くため、上書きでなければならない)。
          # 空文字は select で落ちるので、渡さなかった入力は params の値がそのまま残る。
          # ImageTag が空のままなら UsePreviousValue を足して、今デプロイされているタグを維持する。
          # `. as $params` は必須。| の後の . は元の入力ではなく直前の値になる。
          parameters=$(jq --arg tag "$IMAGE_TAG" --arg cred "$BASIC_AUTH_CREDENTIAL" --arg desired "$WEB_DESIRED_COUNT" '
            . as $params
            | [ {ParameterKey: "ImageTag",            ParameterValue: $tag},
                {ParameterKey: "WebDesiredCount",     ParameterValue: $desired},
                {ParameterKey: "BasicAuthCredential", ParameterValue: $cred} ]
            | map(select(.ParameterValue != "")) + $params
            | unique_by(.ParameterKey)
            | if any(.ParameterKey == "ImageTag") then . else . + [{ParameterKey: "ImageTag", UsePreviousValue: true}] end
          ' "cloudformation/params/${{ inputs.env }}.json")

          # --tags を省略するとスタックのタグが失われる(UpdateStack と同じ挙動)ので毎回渡す。
          aws cloudformation create-change-set \
            --stack-name "$stack" \
            --change-set-name "$name" \
            --change-set-type "$CS_TYPE" \
            --template-url "${{ steps.tpl.outputs.url }}" \
            --role-arn "${{ secrets.AWS_CFN_SERVICE_ROLE_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --tags Key=Project,Value=nuxt-java-practice Key=Env,Value=${{ inputs.env }} Key=ManagedBy,Value=cloudformation \
            --parameters "$parameters" \
            > /dev/null

          # 差分がゼロだと waiter は FAILED で返る。異常ではないので後段で理由を見て分ける
          # (CREATE では起きない)。
          aws cloudformation wait change-set-create-complete \
            --stack-name "$stack" --change-set-name "$name" || true

          detail=$(aws cloudformation describe-change-set \
            --stack-name "$stack" --change-set-name "$name" --output json)
          st=$(echo "$detail" | jq -r '.Status')
          reason=$(echo "$detail" | jq -r '.StatusReason // ""')

          if [ "$st" = "FAILED" ]; then
            if echo "$reason" | grep -qi "didn't contain changes\|No updates are to be performed"; then
              echo "empty=true" >> "$GITHUB_OUTPUT"
              aws cloudformation delete-change-set --stack-name "$stack" --change-set-name "$name"
              {
                echo "### 差分がありませんでした"
                echo ""
                echo "テンプレートと params は既にこのスタックへ反映済みです。"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Change Set の作成に失敗しました: $reason"
            exit 1
          fi

          echo "empty=false" >> "$GITHUB_OUTPUT"

      # 差分をサマリに残し、そのうえで作り直し(Replacement)が含まれていないか判定する。
      # RDS が作り直されると新しい空のインスタンスになり、中のデータは失われる。
      - name: 差分を確認する
        if: steps.cs.outputs.empty == 'false'
        env:
          CS_TYPE: ${{ steps.pre.outputs.type }}
        run: |
          set -euo pipefail
          stack="${{ steps.pre.outputs.stack }}"
          name="${{ steps.cs.outputs.name }}"

          detail=$(aws cloudformation describe-change-set \
            --stack-name "$stack" --change-set-name "$name" --output json)

          # 新規作成の差分は全リソースが Add で並ぶだけなので表にしない(→ 設計書の決定15)。
          if [ "$CS_TYPE" = "CREATE" ]; then
            {
              echo "### 新規作成: $(echo "$detail" | jq '.Changes | length') リソース"
              echo ""
              echo "初回作成の差分は全リソースが Add になるため、表は省略しています。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Change Set の差分"
              echo ""
              echo '```'
              # --output table は列をキー名順に並べる。書いた順ではないので、表示順に合わせてある
              aws cloudformation describe-change-set --stack-name "$stack" --change-set-name "$name" \
                --query 'Changes[].ResourceChange.{"操作":Action,"種類":ResourceType,"置換":Replacement,"論理ID":LogicalResourceId}' \
                --output table
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Replacement は True / False / Conditional の三値(→ 学習メモ §7-2)。
          # Conditional は「実行時の値によって作り直しになるかもしれない」で、Change Set の
          # 時点では確定しない。確定しないだけで危険度は True と変わらないので同じく止める。
          #
          # 【AWS::ECS::TaskDefinition だけは停止の判定から外す】
          # タスク定義は 19 プロパティのうち 17 が createOnlyProperties(更新できるのは Tags だけ)で、
          # イメージタグを変えるだけでも必ず Replacement: True になる。そしてタスク定義はそもそも
          # イミュータブルで、更新とは「新しいリビジョンを登録して古い方を deregister する」ことなので、
          # これは回避不能かつ無害な作り直しである(Database の作り直しと違い、失われるデータが無い)。
          #
          # ここで止めると image_tag を変えるたびに必ず引っかかり、解除する操作が手順の一部になる。
          # そうなると Database が本当に作り直されるときにも同じ反射で解除してしまい、ガードが
          # 守りたかった 1 回を守れなくなる。差分の表には今までどおり出したうえで、判定からだけ外す。
          EXEMPT_TYPE=AWS::ECS::TaskDefinition

          ids() {
            echo "$detail" | jq -r --arg v "$1" --arg exempt "$EXEMPT_TYPE" \
              '[.Changes[].ResourceChange
                | select(.Replacement == $v and .ResourceType != $exempt)
                | .LogicalResourceId] | join(" ")'
          }
          replaced=$(ids True)
          maybe=$(ids Conditional)

          # 外したものは黙って消さずにサマリへ残す。「止まらなかった」ことが見えるようにする
          exempt_ids=$(echo "$detail" | jq -r --arg exempt "$EXEMPT_TYPE" \
            '[.Changes[].ResourceChange
              | select(.ResourceType == $exempt and (.Replacement == "True" or .Replacement == "Conditional"))
              | .LogicalResourceId] | join(" ")')
          if [ -n "$exempt_ids" ]; then
            {
              echo ""
              echo "\`$EXEMPT_TYPE\` の作り直しは新しいリビジョンの登録なので停止しません: \`$exempt_ids\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${replaced}${maybe}" ] && [ "${{ inputs.allow_replacement }}" != "true" ]; then
            {
              echo ""
              echo "### 作り直し(Replacement)の可能性があるため実行しませんでした"
              echo ""
              [ -n "$replaced" ] && echo "- 作り直しになる(\`True\`): \`$replaced\`"
              [ -n "$maybe" ] && echo "- 作り直しになるかもしれない(\`Conditional\`): \`$maybe\`"
              echo ""
              echo "**作り直しはデータを失う操作です。** とくに \`Database\` が含まれている場合、"
              echo "新しい空の RDS に置き換わります(DeletionPolicy が Snapshot なのでスナップショットは残る)。"
              echo ""
              echo "\`Conditional\` は実行時の値に依存するため、実行してみるまで作り直しになるか分かりません。"
              echo ""
              echo "意図した変更であれば allow_replacement=true で再実行してください(True と Conditional の両方が開きます)。"
              echo ""
              echo "**cfn-deploy.yml から呼ばれている場合、この口はありません。**"
              echo "allow_replacement は cfn-apply.yml の workflow_dispatch にしか無く、意図的に渡していません"
              echo "(毎回の解除が手順化してガードが形骸化するため)。次のどちらかで進めてください。"
              echo ""
              echo "- 環境が建ち切っている(WebDesiredCount >= 1)なら、cfn-apply.yml を直接 allow_replacement=true で実行する"
              echo "- 建てている途中(WebDesiredCount=0)なら、cfn-destroy.yml で撤収してから建て直す(作り捨て前提の環境なので、これが正しい)"
            } >> "$GITHUB_STEP_SUMMARY"
            aws cloudformation delete-change-set --stack-name "$stack" --change-set-name "$name"
            echo "::error::作り直しの可能性があります(True: ${replaced:-なし} / Conditional: ${maybe:-なし})。allow_replacement=false のため停止しました"
            exit 1
          fi

      - name: dry run なので実行しない
        if: ${{ steps.cs.outputs.empty == 'false' && inputs.dry_run }}
        run: |
          set -euo pipefail
          aws cloudformation delete-change-set \
            --stack-name "${{ steps.pre.outputs.stack }}" \
            --change-set-name "${{ steps.cs.outputs.name }}"
          {
            echo ""
            echo "**dry run のため実行していません。**反映するには dry_run=false で再実行してください。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Change Set を実行する
        if: ${{ steps.cs.outputs.empty == 'false' && !inputs.dry_run }}
        env:
          CS_TYPE: ${{ steps.pre.outputs.type }}
        run: |
          set -euo pipefail
          stack="${{ steps.pre.outputs.stack }}"

          aws cloudformation execute-change-set \
            --stack-name "$stack" --change-set-name "${{ steps.cs.outputs.name }}"

          if [ "$CS_TYPE" = "CREATE" ]; then
            echo "作成を待ちます(RDS と NAT Gateway があるので 15〜25 分)"
            waiter=stack-create-complete
          else
            echo "反映を待ちます(ECS サービスの入れ替えを含むと 10〜20 分)"
            waiter=stack-update-complete
          fi

          if ! aws cloudformation wait "$waiter" --stack-name "$stack"; then
            echo "::error::スタックの $CS_TYPE が失敗、またはロールバックしました"
            aws cloudformation describe-stack-events --stack-name "$stack" \
              --query 'StackEvents[?contains(ResourceStatus, `FAILED`)] | [0:10].{"論理ID":LogicalResourceId,"状態":ResourceStatus,"理由":ResourceStatusReason}' \
              --output table || true
            exit 1
          fi

      # ジョブサマリに出すのと同じ値を outputs にも書く。
      # 呼び出し側(cfn-deploy.yml の summary ジョブ)が AWS を叩かずに締めのサマリを組み立てられる
      - name: 結果をサマリに出す
        id: result
        if: ${{ success() && steps.cs.outputs.empty == 'false' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          stack="${{ steps.pre.outputs.stack }}"
          json=$(aws cloudformation describe-stacks --stack-name "$stack" --output json)
          out() { echo "$json" | jq -r --arg k "$1" '.Stacks[0].Outputs[] | select(.OutputKey == $k) | .OutputValue'; }
          param() { echo "$json" | jq -r --arg k "$1" '.Stacks[0].Parameters[] | select(.ParameterKey == $k) | .ParameterValue'; }

          app_url=$(out AppUrl)
          alb_dns=$(out LoadBalancerDnsName)
          image_tag=$(param ImageTag)
          desired_count=$(param WebDesiredCount)

          {
            echo "app_url=$app_url"
            echo "alb_dns=$alb_dns"
            echo "image_tag=$image_tag"
            echo "desired_count=$desired_count"
          } >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### 反映しました(${{ inputs.env }})"
            echo ""
            echo '```'
            echo "URL          : $app_url"
            echo "ALB          : $alb_dns"
            echo "イメージタグ : $image_tag"
