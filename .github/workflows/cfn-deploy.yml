# CloudFormation スタックを作成 / 更新する(フェーズ13)。
#
# 設計 → docs/superpowers/specs/2026-08-19-phase13-cloudformation-design.md
# 経緯 → docs/adr/0009-cfn-apply-as-the-single-cloudformation-caller.md
# 手順書 → docs/infrastructure/cloudformation-operations.md の §8
#
# 【このワークフローは順序だけを表現する】
# aws コマンドはここには 1 つも無い。CloudFormation の叩き方は cfn-apply.yml、DB 操作は
# db-task.yml が唯一の正で、こちらは workflow_call で「どの順に呼ぶか」だけを持つ(→ ADR-0009)。
#
# 【2 段階デプロイになっている理由】
# 必要な順序は「RDS 作成 → DB ユーザー作成 → マイグレーション → サービス起動」だが、
# CloudFormation に「このタスクを流してからサービスを起動する」を表現する手段が無い。
# しかも ECS サービスは安定するまで最大 3 時間ポーリングされるので、
# 起動できない状態で作るとスタックが失敗する。
# そこで DesiredCount=0 で作り(0 タスクなら即座に安定する)、Run Task を回してから
# もう一度スタックを更新して N に上げる。
#
# 【cfn-apply.yml に渡している 3 つの入力】
# web_desired_count / allow_missing_stack / allow_zero_desired_count は cfn-apply.yml の
# workflow_call にしか宣言されていない入力で、既存環境向けの guard を外すためのもの。
# guard のエラーメッセージはどちらも「cfn-deploy.yml を使ってください」と言っており、
# 呼び出し元がこのワークフロー本人ならその案内は意味を持たない(→ cfn-apply.yml 冒頭)。
#
# 【途中で失敗したら、このワークフローをもう一度流す】
# 中途半端な環境は必ず「WebDesiredCount=0」に収束するので、再実行が安全に通る。
# 1 段目は差分ゼロで素通りし、4 段目が 0 → params の値に上げ直す。
# 例外は CREATE そのものが失敗した場合(ROLLBACK_COMPLETE)で、これは cfn-destroy.yml が先。
# 対応表 → 手順書 §8「途中で失敗したとき」。
name: CloudFormation スタックを作成/更新

on:
  workflow_dispatch:
    inputs:
      env:
        description: 対象環境
        type: choice
        options: [stg]
        default: stg
      image_tag:
        description: ECR のイメージタグ(ecr-push.yml のジョブサマリに出る短縮 SHA)
        type: string
        required: true
      dry_run:
        description: Change Set を作るだけで実行しない(テンプレートの検証と権限の確認)
        type: boolean
        default: false

# 呼ばれる側の権限は「呼び出し側を上限として下げられる」だけなので、ここを削ると
# cfn-apply.yml / db-task.yml の AssumeRole が落ちる。
permissions:
  id-token: write
  contents: read

# 同じ環境に対して同時にデプロイしない(CloudFormation 側でも弾かれるが、
# 途中で Run Task が走る構成なので手前で止める)。
# cfn-destroy.yml と同じグループ。cfn-apply.yml は concurrency を持たない
# (呼ばれる側が同じグループを持つと親子で枠を取り合って止まるため → cfn-apply.yml 冒頭)
concurrency:
  group: cfn-deploy-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1 段目: DesiredCount=0 でスタックを作成 / 更新する
  # ---------------------------------------------------------------------------
  deploy-zero:
    uses: ./.github/workflows/cfn-apply.yml
    with:
      env: ${{ inputs.env }}
      image_tag: ${{ inputs.image_tag }}
      dry_run: ${{ inputs.dry_run }}
      web_desired_count: "0"
      allow_missing_stack: true
      allow_zero_desired_count: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 2 段目: DB ユーザーを作る
  # ---------------------------------------------------------------------------
  bootstrap:
    needs: deploy-zero
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/db-task.yml
    with:
      env: ${{ inputs.env }}
      action: bootstrap
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 3 段目: マイグレーション
  # ---------------------------------------------------------------------------
  migrate:
    needs: bootstrap
    uses: ./.github/workflows/db-task.yml
    with:
      env: ${{ inputs.env }}
      action: migrate
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 4 段目: サービスを起動する
  #
  # web_desired_count を渡さないので params の WebDesiredCount に収束する。
  # allow_zero_desired_count が必要なのは「今の」値が 0(1 段目が入れた値)だから。
  # ---------------------------------------------------------------------------
  deploy-service:
    needs: migrate
    uses: ./.github/workflows/cfn-apply.yml
    with:
      env: ${{ inputs.env }}
      image_tag: ${{ inputs.image_tag }}
      allow_zero_desired_count: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 5 段目: 締めのサマリ
  #
  # 値は 4 段目の outputs から受け取るので AWS を叩かない(AssumeRole も要らない)。
  # ---------------------------------------------------------------------------
  summary:
    needs: deploy-service
    runs-on: ubuntu-latest
    steps:
      - name: 結果をサマリに出す
        env:
          APP_URL: ${{ needs.deploy-service.outputs.app_url }}
          ALB_DNS: ${{ needs.deploy-service.outputs.alb_dns }}
          IMAGE_TAG: ${{ needs.deploy-service.outputs.image_tag }}
          DESIRED_COUNT: ${{ needs.deploy-service.outputs.desired_count }}
        run: |
          set -euo pipefail
          # 4 段目が「差分なし」で素通りしたときは outputs が空で返る
          {
            echo ""
            echo "### 構築が完了しました(${{ inputs.env }})"
            echo ""
            echo '```'
            echo "URL          : ${APP_URL:-(取得できませんでした)}"
            echo "ALB          : ${ALB_DNS:-(取得できませんでした)}"
            echo "イメージタグ : ${IMAGE_TAG:-(取得できませんでした)}"
            echo "タスク数     : ${DESIRED_COUNT:-(取得できませんでした)}"
            echo '```'
            echo ""
            echo "**SES の検証が完了するまでメールは飛びません。**スタックの成功とは無関係です"
            echo "(AWS::SES::EmailIdentity は検証完了を待たずに CREATE_COMPLETE になる)。"
          } >> "$GITHUB_STEP_SUMMARY"
