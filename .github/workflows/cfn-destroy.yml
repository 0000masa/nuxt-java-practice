# CloudFormation スタックを削除して撤収する(フェーズ13)。
#
# 設計 → docs/superpowers/specs/2026-08-19-phase13-cloudformation-design.md の決定14
#
# 【stg 専用】本番のスタックを消すワークフローは作らない。実務では本番の撤収は
# 人が手で、承認を伴って行うもので、ボタン 1 つで消せる状態にはしない。
# その前提のおかげで「バケットを空にする処理を環境ごとに切り替える」必要もなくなり、
# 素の CloudFormation に force_destroy 相当が無い問題を運用側で解けている。
#
# 残るもの: Route53 ホストゾーン / ECR / OIDC プロバイダ / IAM ロール 3 つ / SSM の SecureString
name: CloudFormation スタックを削除

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 削除する場合は destroy と入力する
        type: string
        required: true

env:
  AWS_REGION: ap-northeast-1
  # stg 固定。prod をここに足さない(上のコメントの理由)
  ENV_NAME: stg

permissions:
  id-token: write
  contents: read

concurrency:
  group: cfn-deploy-stg
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: stg
    steps:
      - name: 入力を確かめる
        run: |
          if [ "${{ inputs.confirm }}" != "destroy" ]; then
            echo "::error::confirm に destroy と入力してください"
            exit 1
          fi

      - name: AWS に AssumeRole する(OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CFN_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: スタックの存在を確かめる
        id: check
        run: |
          set -uo pipefail
          if aws cloudformation describe-stacks --stack-name "nuxt-java-practice-$ENV_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "スタックが存在しないので何もしません"
          fi

      # 素の CloudFormation には Terraform の force_destroy に相当する機能が無く、
      # オブジェクトが残っているバケットは削除に失敗する。ここで空にしてから消す。
      #
      # バケットは 2 つある。画像バケットの書き手はアプリだけなので撤収時は静かだが、
      # ログアーカイブのバケットには **Firehose が 900 秒ごとに自動で書きにくる**。
      # 「空にする → delete-stack」の間(ECS サービスの削除などで 1〜3 分)にフラッシュが
      # 挟まると BucketNotEmpty になり、15 分待たされた末に DELETE_FAILED で終わる。
      #
      # そのため 1 回だけリトライする。2 回目が確実に成功するのは、1 回目の削除で
      # Firehose とサブスクリプションフィルタが既に消えていて書き手がいないため
      # (バケットは Firehose に依存されているので、CloudFormation は Firehose を先に消す)。
      # → docs/adr/0010
      - name: バケットを空にしてスタックを削除する
        if: steps.check.outputs.exists == 'true'
        run: |
          set -euo pipefail
          stack="nuxt-java-practice-$ENV_NAME"

          # バケット名は先に控える。DELETE_FAILED になった後のスタックからは
          # Outputs を読めるとは限らないため、リトライ時に引き直さない。
          buckets=""
          for key in ImageBucketName LogArchiveBucketName; do
            b=$(aws cloudformation describe-stacks --stack-name "$stack" \
              --query "Stacks[0].Outputs[?OutputKey=='$key'].OutputValue | [0]" --output text)
            if [ -n "$b" ] && [ "$b" != "None" ]; then
              buckets="$buckets $b"
            fi
          done

          empty_buckets() {
            for b in $buckets; do
              echo "空にします: s3://$b"
              aws s3 rm "s3://$b" --recursive
            done
          }

          # サービスロールを明示する。省略しても create-change-set が渡したロールが
          # スタックに紐づいている(Stack の RoleARN)ので通常は同じ結果になるが、
          # 紐づいていないスタック(手で作った場合など)では Actions のロール
          # (cloudformation:* しか持たない)の一時セッションで削除が試みられ、
          # リソースを消せずに DELETE_FAILED になる。明示すればその分岐が消える。
          delete_stack() {
            aws cloudformation delete-stack --stack-name "$stack" \
              --role-arn "${{ secrets.AWS_CFN_SERVICE_ROLE_ARN }}" &&
            aws cloudformation wait stack-delete-complete --stack-name "$stack"
          }

          empty_buckets
          echo "削除を待ちます(RDS と NAT Gateway があるので 10〜15 分かかる)"
          # if の条件にすると関数の中でも errexit が効かないので、失敗を握って分岐できる
          if delete_stack; then
            exit 0
          fi

          echo "::warning::1 回目の削除に失敗しました。失敗したリソースは以下です"
          aws cloudformation describe-stack-events --stack-name "$stack" \
            --query "StackEvents[?ResourceStatus=='DELETE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
            --output text | head -20 || true

          echo "バケットを空にして 1 回だけやり直します"
          empty_buckets
          delete_stack

      - name: 結果をサマリに出す
        if: always()
        run: |
          {
            echo "### 撤収($ENV_NAME)"
            echo ""
            if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
              echo "スタックを削除しました。"
            else
              echo "スタックが存在しなかったため何もしていません。"
            fi
            echo ""
            echo "**残っているもの**(手動管理なので消えません)"
            echo "- Route53 ホストゾーンとドメイン代"
            echo "- ECR リポジトリとイメージ"
            echo "- OIDC プロバイダと IAM ロール 3 つ"
            echo "- SSM の SecureString 4 つ"
          } >> "$GITHUB_STEP_SUMMARY"
