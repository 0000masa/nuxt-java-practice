AWSTemplateFormatVersion: "2010-09-09"

# =============================================================================
# 投稿アプリの検証環境(1 スタックで作り捨て)
# =============================================================================
# 設計 → docs/superpowers/specs/2026-08-19-phase13-cloudformation-design.md
# 運用 → docs/infrastructure/README.md
#
# このテンプレートは「共通部分」で、環境ごとの値は params/<env>.json から渡す。
# prod を作るときは params/prod.json を足すだけで、このファイルは触らない。
#
# 手動管理(このスタックが作らないもの):
#   Route53 ホストゾーン / ECR リポジトリ / OIDC プロバイダ / IAM ロール 4 つ /
#   SSM の SecureString 4 つ
#
# 建てる手順は 2 段階(DesiredCount を 0 → N)。理由は設計書の決定12。
# =============================================================================

# Description はマルチバイト文字を保持せず、コンソール上で ? に化ける
# (AWS のドキュメントには 0〜1024 バイトとしか書かれていない、未文書の挙動)。
# 日本語の説明は上のコメントブロックに置き、ここは英語で書く。
Description: Verification environment for the posting app (ALB + ECS Fargate + RDS MySQL)

# -----------------------------------------------------------------------------
# パラメータ
# -----------------------------------------------------------------------------
# CloudFormation の Parameters は String / Number / List しか持てないため、
# Terraform の rds_config のような構造化した型は使えず、各フィールドを平坦に開く。
# 環境差分をテンプレートに直書きしない(Mappings を使わない)のは、prod を追加するときに
# 共通部分を編集しなくて済むようにするため。設計書の決定2。
# -----------------------------------------------------------------------------
Parameters:
  EnvName:
    Type: String
    AllowedValues: [stg, prod]
    Description: 環境名。リソース名とタグに入る

  ProjectName:
    Type: String
    Default: nuxt-java-practice
    Description: リソース名の接頭辞

  DomainName:
    Type: String
    Description: 手動管理のホストゾーンのドメイン(例 mylabinfra.com)

  AppSubdomain:
    Type: String
    Description: アプリの階層。FQDN は <EnvName>.<AppSubdomain>.<DomainName> になる

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      手動管理のホストゾーンの ID。CloudFormation には Terraform の
      data "aws_route53_zone" に相当する仕組みが無いので外から渡す

  EcrRepositoryName:
    Type: String
    Description: 手動管理の ECR リポジトリ名。イメージ URI はアカウント ID とリージョンから組み立てる

  # 【初回構築でだけ意味を持つ】
  # AppTaskDefinition と MigrateTaskDefinition の初代を作るための値。
  # 2 代目以降のイメージはパイプラインが taskdef.json / taskdef-migrate.json から
  # register するので、ここを変えても既に動いているサービスは切り替わらない
  # (Service.TaskDefinition が family 名の固定文字列になったため)。
  # だから cfn-apply.yml の workflow_dispatch には image_tag を宣言していない。→ ADR-0013
  ImageTag:
    Type: String
    Description: ECR のイメージタグ(コミットの短縮 SHA)。パイプラインの Build ステージのログに出る値

  SsmParameterPath:
    Type: String
    Description: 手動作成した SecureString の置き場(末尾スラッシュあり。例 /nuxt-java-practice/stg/)
    AllowedPattern: ^/.*/$

  # この値だけ SSM に置かずパラメータで受けている理由。
  # 他の機密(DB パスワード、Google の ID / シークレット)は SSM の SecureString に置き、
  # ECS のタスク定義の Secrets / ValueFrom で注入している。CloudFormation は値を読まない。
  # しかしこの値は WAF のルールに埋め込む必要があり、同じ手が使えない。
  # SecureString をテンプレートから読む手段は {{resolve:ssm-secure:...}} だが、
  # これは対応プロパティが 11 個(RDS の MasterUserPassword、IAM ユーザーの LoginProfile.Password など)
  # に限定されていて、AWS::WAFv2::WebACL の ByteMatchStatement.SearchString は入っていない。
  # 平文の {{resolve:ssm:...}} にはプロパティの制限が無いが、SSM 側を平文の String 型で
  # 持つことになるので採らない。
  # → https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-ssm-secure-strings.html
  # → docs/adr/0006-basic-auth-with-waf.md
  BasicAuthCredential:
    Type: String
    NoEcho: true
    Default: ""
    Description: >-
      Basic 認証の生の資格情報 "user:pass"。base64 化はテンプレート側で行う。
      params ファイルには置かず、GitHub の Environment secret からワークフローが渡す

  # --- ネットワーク ---
  VpcCidr:
    Type: String
    Default: 192.168.0.0/20
  PublicSubnetACidr:
    Type: String
    Default: 192.168.3.0/24
  PublicSubnetCCidr:
    Type: String
    Default: 192.168.4.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 192.168.1.0/24
  PrivateSubnetCCidr:
    Type: String
    Default: 192.168.2.0/24

  # --- RDS ---
  DbInstanceClass:
    Type: String
    Description: prod は db.t4g.medium 以上(Performance Insights の対応もそこから)
  DbAllocatedStorage:
    Type: Number
    MinValue: 20
  # 設定しないとストレージ自動スケーリングは働かず、割当は DbAllocatedStorage で固定される。
  # 空きが尽きると storage-full で DB が止まるので、逃げ道としてこちらを開けておく。
  # DbAllocatedStorage より大きい必要があるが、パラメータをまたぐ制約は AllowedValues では
  # 書けない(WebCpu と WebMemory の組み合わせと同じ)。値を変えるときは両方を見ること。
  DbMaxAllocatedStorage:
    Type: Number
    MinValue: 20
    Description: >-
      ストレージ自動スケーリングの上限(GiB)。伸びた分は縮小できないので、
      「事故で自動的に払ってよい上限額」として決める
  DbMultiAZ:
    Type: String
    AllowedValues: ["true", "false"]
  DbBackupRetentionDays:
    Type: Number
    MinValue: 0
    MaxValue: 35
    Description: 0 で自動バックアップ無効。撤収前提の stg は 0
  DbDeleteAutomatedBackups:
    Type: String
    AllowedValues: ["true", "false"]
    Description: DB を消したときに保持期間内の自動バックアップも消すか。prod は false(消した後の最後の復旧手段になる)
  # 削除の API そのものを拒否する。DeletionPolicy は属性なので環境で切り替えられないが、
  # こちらはただのプロパティなので !Ref が効く。→ docs/notes/cloudformation/environment-differences.md §5-4
  DbDeletionProtection:
    Type: String
    AllowedValues: ["true", "false"]
    Description: prod は true。true のままだと delete-stack が RDS を消せず撤収ごと失敗するので、消す前に false へ更新する 1 手が要る
  DbPerformanceInsights:
    Type: String
    AllowedValues: ["true", "false"]
    Description: >-
      db.t4g の micro / small は非対応で、true にすると
      InvalidParameterCombination で失敗する(選択ではなく制約)
  DbMonitoringInterval:
    Type: Number
    AllowedValues: [0, 1, 5, 10, 15, 30, 60]
    Description: 拡張モニタリングの収集間隔(秒)。0 で無効。60 秒なら取り込み量が CloudWatch Logs の無料枠に収まる
  DbName:
    Type: String
    Default: app
  DbMasterUsername:
    Type: String
    Default: admin
    Description: パスワードは RDS が生成して Secrets Manager が保持する(ManageMasterUserPassword)
  DbAppUsername:
    Type: String
    Default: app
    Description: DML だけを持つユーザー。db-ops タスクが作る → docs/adr/0005
  DbMigrateUsername:
    Type: String
    Default: migrate
    Description: DDL を持つユーザー。db-migrate タスクだけが使う

  # --- ECS ---
  WebCpu:
    Type: String
    AllowedValues: ["256", "512", "1024", "2048", "4096"]
  WebMemory:
    Type: String
    Description: MiB。WebCpu と組み合わせが決まっている
  WebDesiredCount:
    Type: Number
    MinValue: 0
    Description: >-
      ワークフローが 1 段目で 0 を渡す(ユーザー作成前にタスクを起動できないため)。
      0 のときはオートスケーリングも作らない
  # capacity provider の混合戦略。stg は Spot 100%、prod は「最低 2 タスクはオンデマンドで
  # 確保し、それを超えた分は全部 Spot」を表す。3 本に分かれているのは、ECS の戦略が
  # 「オブジェクトのリスト」で、Parameters に平坦な型しか無いため(→ 対訳ノート §4-1)。
  #
  # base は戦略の中で 1 つの provider にしか付けられない(仕様)ので FARGATE 側に置く。
  # weight は base を満たした後の配分比で、weight 0 の provider は base 以外に使われない。
  WebOnDemandBase:
    Type: Number
    MinValue: 0
    MaxValue: 10
    Description: >-
      FARGATE で必ず確保するタスク数。WebMaxCapacity を超える値は無意味だが、
      パラメータをまたぐ検証は書けないので上限は緩い(→ 学習メモ §9-4)
  WebOnDemandWeight:
    Type: Number
    MinValue: 0
    MaxValue: 1000
    Description: base を超えた分の FARGATE 取り分。base と両方 0 なら FARGATE の要素ごと消える
  # 【MinValue が 1 である理由】0 を許すと WebOnDemandBase / WebOnDemandWeight と合わせて
  # 3 つとも 0 にでき、CapacityProviderStrategy が空リストになる。このクラスタは
  # DefaultCapacityProviderStrategy を持たないので、そのとき ECS は
  # 「No launch type to fall back to for empty capacity provider strategy」で失敗する。
  # Change Set は通ってしまうため、スタック更新の実行中に落ちてロールバックになる。
  # 「Spot を使わない」構成が要るなら weight 0 ではなく base >= desired で表す。
  WebSpotWeight:
    Type: Number
    MinValue: 1
    MaxValue: 1000
    Description: base を超えた分の FARGATE_SPOT 取り分。比なので絶対値ではなく WebOnDemandWeight との比率が効く
  WebMinCapacity:
    Type: Number
    MinValue: 1
  WebMaxCapacity:
    Type: Number
    MinValue: 1
  WebCpuTarget:
    Type: Number
    Description: CPU 使用率の目標値(%)。これを超えるとスケールアウト
  WebMemoryTarget:
    Type: Number
  # クールダウンは「増やした/減らした直後、次の増減まで待つ秒数」。スケールアウトは詰まると
  # 機会損失になるので短く、スケールインは prod ほど長く待つ(谷でタスクを削ると、次の山で
  # Spring Boot の起動 30〜60 秒 + HealthCheckGracePeriodSeconds 120 秒を払い直すことになる)。
  WebCpuScaleInCooldown:
    Type: Number
    MinValue: 0
  WebCpuScaleOutCooldown:
    Type: Number
    MinValue: 0
  WebMemoryScaleInCooldown:
    Type: Number
    MinValue: 0
    Description: メモリは CPU ほど素直に下がらないので、CPU 側より長めに待たせる
  WebMemoryScaleOutCooldown:
    Type: Number
    MinValue: 0
  ContainerInsights:
    Type: String
    # disabled を許していない。ECS タスク数不足のアラーム(EcsRunningLessThanDesiredAlarm)は
    # ECS/ContainerInsights 名前空間の RunningTaskCount / DesiredTaskCount を読むので、
    # 切るとアラームは残ったまま二度と鳴らなくなる(標準の AWS/ECS にタスク数のメトリクスは無い)。
    # 費用を抑えたいときは enhanced -> enabled に落とす。→ docs/adr/0010
    AllowedValues: [enhanced, enabled]

  # --- 監視・検知(→ docs/adr/0010・docs/adr/0011) ---
  # 通知先は Slack。Amazon Q Developer in chat applications(旧 AWS Chatbot)が
  # SNS トピックを購読してチャンネルに転送する。手順 → docs/slack/README.md
  #
  # 【この 3 つを params に平文で置いている理由】秘密ではないため。
  # ID を知っていても、ワークスペースを認可済みの AWS アカウントからしか使えない。
  # Slack の Incoming Webhook URL(知っていれば誰でも投稿できる)とはここが違う。
  # HostedZoneId と同じ「秘密ではないがアカウント固有」の値として扱う。
  # メールアドレスと違って NoEcho も Environment secret も要らない。→ docs/adr/0011
  #
  # AllowedPattern を付けているのは、params のプレースホルダ(REPLACE_WITH_...)のまま
  # 反映しようとしたときに Change Set の作成で落とすため。付けないと Chatbot リソースの
  # 作成まで進んでから同じ理由で失敗する。かつての AlertEmail に Default を置かなかったのと同じ判断で、
  # 検知層が黙って死ぬより構築が止まるほうがマシ。
  SlackWorkspaceId:
    Type: String
    AllowedPattern: ^[0-9A-Z]{1,255}$
    Description: Slack ワークスペースの ID。AWS コンソールでの認可を済ませると得られる(→ docs/slack/README.md)

  SlackChannelIdEcs:
    Type: String
    AllowedPattern: ^[A-Za-z0-9]+$
    Description: ECS の検知を流す Slack チャンネルの ID(#njp-alerts-ecs)

  SlackChannelIdRds:
    Type: String
    AllowedPattern: ^[A-Za-z0-9]+$
    Description: RDS の検知を流す Slack チャンネルの ID(#njp-alerts-rds)

  # 以下 4 つは AWS 公式の推奨アラーム(Best Practice Recommended Alarms)ベース。
  # インスタンスクラスとストレージ容量に連動するので環境ごとに渡す。
  # CloudFormation に算術の組み込み関数が無いため、計算済みの値を params に書く。
  RdsCpuThresholdPercent:
    Type: Number
    MinValue: 1
    MaxValue: 100
    Description: CPUUtilization がこれを超えた状態が 5 分続いたら通知
  RdsFreeStorageThresholdBytes:
    Type: Number
    Description: FreeStorageSpace がこれを下回ったら通知。割当ストレージの 10% が目安
  RdsFreeableMemoryThresholdBytes:
    Type: Number
    Description: FreeableMemory がこれを下回ったら通知。インスタンスの RAM の 25% が目安
  RdsConnectionsThreshold:
    Type: Number
    Description: >-
      DatabaseConnections がこれを超えたら通知。max_connections は
      {DBInstanceClassMemory/12582880} でメモリ連動なので、
      インスタンスクラスを変えたらこの値も見直す

  # --- その他 ---
  LogRetentionDays:
    Type: Number
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  EnableBasicAuth:
    Type: String
    AllowedValues: ["true", "false"]
    Description: WAF による Basic 認証。stg は true / prod は false → docs/adr/0006

# -----------------------------------------------------------------------------
# 定数
# -----------------------------------------------------------------------------
Mappings:
  # CloudFront のマネージドポリシーは ID を直書きするしかない。
  # Terraform の data "aws_cloudfront_cache_policy" に相当するデータソースが CloudFormation に無い。
  CloudFrontManagedPolicy:
    CachePolicy:
      # Managed-CachingOptimized
      Optimized: 658327ea-f89d-4fab-a63d-7e88639e58f6
    OriginRequestPolicy:
      # Managed-CORS-S3Origin
      CorsS3: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf

Conditions:
  # DesiredCount が 0 の段(DB ユーザー作成待ち)ではオートスケーリングを作らない。
  # Application Auto Scaling は MinCapacity を下回る状態を見つけると勝手に増やすため、
  # 0 のはずのサービスにタスクが立ち上がってクラッシュループする。
  ServiceEnabled: !Not [!Equals [!Ref WebDesiredCount, 0]]

  BasicAuthEnabled: !Equals [!Ref EnableBasicAuth, "true"]

  EnhancedMonitoringEnabled: !Not [!Equals [!Ref DbMonitoringInterval, 0]]

  # base も weight も 0 なら FARGATE の要素を出さない(stg = Spot 100%)。
  # Fn::If はリストの要素としても使えて、AWS::NoValue を返すと要素ごと消える(→ 学習メモ §8-3)
  UseOnDemand: !Or
    - !Not [!Equals [!Ref WebOnDemandBase, 0]]
    - !Not [!Equals [!Ref WebOnDemandWeight, 0]]

Resources:
  # ===========================================================================
  # ネットワーク
  # ===========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # AZ は Fn::GetAZs で引く。ap-northeast-1 の a / c を直書きしないのは、
  # リージョンを変えたときにテンプレートを直さなくて済むようにするため。
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-public-a

  PublicSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-public-c

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-private-a

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetCCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-private-c

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetC
      RouteTableId: !Ref PublicRouteTable

  # NAT Gateway は 1 台だけ(single_nat_gateway 相当)。
  # プライベートサブネットのタスクが ECR の API・CloudWatch Logs・SSM・SES に出るために必要。
  # prod では AZ ごとに立てるのが定石だが、そのときはこのリソースと EIP を 2 組にする。
  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-nat

  # プライベート側のルートテーブルは AZ ごとに分ける。
  # NAT が 1 台でも分けておくのは、prod で NAT を 2 台にするときに
  # ルートの向き先を変えるだけで済むようにするため。
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-private-rt-a

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-private-rt-c

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateDefaultRouteC:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetCRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref PrivateRouteTableC

  # VPC エンドポイントはこれだけ。ゲートウェイ型は時間課金もデータ処理課金も無く、
  # ENI ではなくルートテーブルにルートが入る仕組みなので無料で置ける。
  # 画像(フェーズ6)の S3 通信に加え、ECR のイメージレイヤーの実体は S3 にあるため
  # pull の転送量も NAT を通らなくなる(ECR の API 呼び出し自体は NAT 経由のまま)。
  # ゲートウェイ型が使えるのは S3 と DynamoDB だけで、logs / ssm / ses は Interface 型しかない。
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableC

  # ===========================================================================
  # セキュリティグループ
  # ===========================================================================
  # 【この下の Description は英語でなければならない】
  # EC2 は SG のルールの説明に使える文字を a-zA-Z0-9 と . _-:/()#,@[]+=&;{}!$* と空白に
  # 限っている。日本語を書くと EC2 が 400(Invalid rule description)を返し、
  # CREATE_FAILED になる。テンプレートの構文は正しいので Change Set は通ってしまい、
  # 実行して初めて落ちる(GroupDescription も同じ制約)。
  # 日本語で書きたい説明は、この行のように YAML のコメントに置く。
  #
  # ALB は 0.0.0.0/0 に開ける。外部からの隔離は WAF の Basic 認証が担う(→ docs/adr/0006)。
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName}-${EnvName} ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Redirect to HTTPS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Production traffic
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-alb-sg

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName}-${EnvName} ECS tasks
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-ecs-sg

  # ALB → ECS は 8080(Spring Boot の組み込み Tomcat)。Nginx を使わないので 80 ではない。
  # SG のルールを別リソースにしているのは、ALB SG と ECS SG が相互参照になると
  # CloudFormation が循環依存として拒否するため。
  EcsSecurityGroupIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: From ALB only

  # 外向きは全開。ECR / CloudWatch Logs / SSM / Secrets Manager / SES / S3 に出る必要がある。
  EcsSecurityGroupEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      IpProtocol: "-1"
      CidrIp: 0.0.0.0/0
      Description: To AWS services via NAT

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName}-${EnvName} RDS
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref EcsSecurityGroup
          Description: From ECS tasks only (service / db-ops / db-migrate)
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-rds-sg

  # ===========================================================================
  # 証明書と DNS
  # ===========================================================================
  # DomainValidationOptions に HostedZoneId を渡すと、CloudFormation が検証用の CNAME を
  # 自分で作り、発行完了まで待ってくれる。Terraform で必要だった
  # 「domain_validation_options を for_each して Route53 レコードを作る」20 行が要らない。
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub ${EnvName}.${AppSubdomain}.${DomainName}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub ${EnvName}.${AppSubdomain}.${DomainName}
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-cert

  # ホストゾーンは手動管理。スタックが出し入れするのは中のレコードだけ。
  AppDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub ${EnvName}.${AppSubdomain}.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # ===========================================================================
  # SES
  # ===========================================================================
  # このスタックに含める代償: 撤収すると DKIM の CNAME も消え、再構築時に検証が
  # 通るまでメールが飛ばない。しかも EmailIdentity は検証完了を待たずに
  # CREATE_COMPLETE になるので「スタックは成功したのにメールだけ来ない」状態を踏む。
  # 設計書の決定5。
  EmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Sub ${EnvName}.${AppSubdomain}.${DomainName}
      DkimAttributes:
        SigningEnabled: true

  # count / for_each が無いので 3 本べた書きする。
  DkimRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt EmailIdentity.DkimDNSTokenName1
      Type: CNAME
      TTL: 600
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue1

  DkimRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt EmailIdentity.DkimDNSTokenName2
      Type: CNAME
      TTL: 600
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue2

  DkimRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !GetAtt EmailIdentity.DkimDNSTokenName3
      Type: CNAME
      TTL: 600
      ResourceRecords:
        - !GetAtt EmailIdentity.DkimDNSTokenValue3

  # ===========================================================================
  # ロググループ
  # ===========================================================================
  # RDS のロググループを明示的に作って RDS に DependsOn させる。
  # 先に消えると、RDS が削除処理中の最終書き込みで同名のロググループを作り直し、
  # スタック管理外の孤児(保持期間 無期限)が残る。
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /ecs/${ProjectName}-${EnvName}
      RetentionInDays: !Ref LogRetentionDays

  RdsErrorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/rds/instance/${ProjectName}-${EnvName}-db/error
      RetentionInDays: !Ref LogRetentionDays

  RdsSlowQueryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/rds/instance/${ProjectName}-${EnvName}-db/slowquery
      RetentionInDays: !Ref LogRetentionDays

  # ===========================================================================
  # RDS
  # ===========================================================================
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${ProjectName}-${EnvName}
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetC
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-db-subnet-group

  # スロークエリログは既定のパラメータグループでは生成すらされないので有効化する。
  # フェーズ8(検索ラボ)とフェーズ10(index 実験)で使う。
  # 注意: MariaDB は 10.11 で変数名が変わったが(log_slow_query など)、MySQL は従来名のまま。
  # 参考にした Terraform リポジトリは MariaDB なので、あちらの変数名はここでは通らない。
  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: !Sub ${ProjectName}-${EnvName} MySQL 8.4
      Family: mysql8.4
      Parameters:
        slow_query_log: "1"
        # 秒。MySQL の既定は 10 秒だが、Web アプリで 10 秒は既に大事故なので 1 秒に締める
        long_query_time: "1"
        # CloudWatch Logs へのエクスポートは「インスタンス内のログファイルを転送する」仕組みなので、
        # 既定の TABLE のままだと mysql.slow_log テーブルに書かれ、転送すべきファイルが存在しない。
        # エラーログはこの設定に関係なく常にファイル出力される。
        log_output: FILE

  RdsMonitoringRole:
    Type: AWS::IAM::Role
    Condition: EnhancedMonitoringEnabled
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-rds-monitoring-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole

  Database:
    Type: AWS::RDS::DBInstance
    # 【重要】RDS だけは DeletionPolicy の既定が Delete ではなく Snapshot。
    # 明示しないとスタックを消してもスナップショットが残って課金が続く。
    # UpdateReplacePolicy も同じ理由で明示する(作り直しが起きたときの取り残し防止)。
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - RdsErrorLogGroup
      - RdsSlowQueryLogGroup
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-${EnvName}-db
      Engine: mysql
      # 開発環境(docker compose の mysql:8)が 8.4.x なので合わせる
      EngineVersion: "8.4"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: !Ref DbMaxAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbMasterUsername
      # パスワードを渡さない。RDS が生成して Secrets Manager にシークレットを作る。
      # テンプレートにも SSM にも手元にも値が現れず、DB を消すとシークレットも消える。
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DBParameterGroupName: !Ref DbParameterGroup
      PubliclyAccessible: false
      MultiAZ: !Ref DbMultiAZ
      DeletionProtection: !Ref DbDeletionProtection
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      DeleteAutomatedBackups: !Ref DbDeleteAutomatedBackups
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: !Ref DbPerformanceInsights
      MonitoringInterval: !Ref DbMonitoringInterval
      # 拡張モニタリングが無効(0)のときにロールを渡すと組み合わせエラーになるので外す
      MonitoringRoleArn: !If
        - EnhancedMonitoringEnabled
        - !GetAtt RdsMonitoringRole.Arn
        - !Ref AWS::NoValue
      EnableCloudwatchLogsExports:
        - error
        - slowquery
      # UTC。JST では月曜 00:00-00:30
      PreferredMaintenanceWindow: sun:15:00-sun:15:30
      # UTC。JST 02:00-02:30(メンテナンスウィンドウと重ならないように)
      PreferredBackupWindow: "17:00-17:30"
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-db

  # ===========================================================================
  # 画像用の S3 と CloudFront
  # ===========================================================================
  # フェーズ6(画像)で使う。撤収時はワークフローが aws s3 rm --recursive で空にしてから
  # delete-stack する(素の CloudFormation に force_destroy 相当は無い)。
  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${ProjectName}-${EnvName}-images
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ImageOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-${EnvName}-images-oac
        Description: 画像バケットへは CloudFront 経由のみ
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 独自ドメインは付けない。CloudFront 用の ACM 証明書は us-east-1 にしか置けず、
  # スタックは 1 リージョンに閉じるため、付けるとクロスリージョンの分割が必要になる。
  # 画像 URL はオブジェクトキーとこのドメインから組み立てる設計なのでアプリ側は影響を受けない。
  ImageDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        Comment: !Sub ${ProjectName}-${EnvName}-images
        Origins:
          - Id: image-bucket
            DomainName: !GetAtt ImageBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImageOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: image-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !FindInMap [CloudFrontManagedPolicy, CachePolicy, Optimized]
          OriginRequestPolicyId: !FindInMap [CloudFrontManagedPolicy, OriginRequestPolicy, CorsS3]

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ImageBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ImageDistribution}

  # ===========================================================================
  # ALB
  # ===========================================================================
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-alb
      Type: application
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetC
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvName}-alb

  # Blue/Green はターゲットグループを 2 つ使う。CodeDeploy はデプロイのたびに
  # green 側へタスクセットを作り、HTTPS リスナーの既定アクションを付け替える。
  # 2 つとも CodeDeployDeploymentGroup の LoadBalancerInfo が TargetGroupName 属性で参照する。
  # ヘルスチェックは actuator の liveness(DB を含まない)。DB を含む health を使うと
  # RDS が一時的に落ちたときに全タスクが unhealthy になって入れ替わり続ける。
  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-tg-blue
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/actuator/health/liveness
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        # 撤収前提の検証環境なので、切り離しを待たせる意味がない
        - Key: deregistration_delay.timeout_seconds
          Value: "10"

  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-tg-green
      VpcId: !Ref Vpc
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /api/actuator/health/liveness
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "10"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # 【既定アクションが本番トラフィックの入口である】
  # CodeDeploy の Blue/Green は「リスナーの既定アクション」を blue と green の間で
  # 書き換えることで切り替える。TrafficRoute.ListenerArns の定義は
  # 「The Amazon Resource Name (ARN) of one listener.」で、リスナールール ARN は渡せない。
  #
  # CodeDeploy がデプロイ中にこの既定アクションを書き換える。Terraform では
  # ignore_changes = [default_action] が要るところだが、CloudFormation は実リソースの
  # 状態を読み直さず「前回のテンプレート」との差分だけを適用するので不要。
  # ただし後でこのリソースの定義を編集すると、そのとき向き先もテンプレートの値(blue)に戻る。
  #
  # 【かつてここは fixed-response 403 だった】
  # 「既定は 403、ホスト名が一致したものだけを priority 100 のルールが blue/green へ通す」
  # という構成にしていた。ECS ネイティブ Blue/Green はリスナールール単位で動くので
  # それが成立したが、CodeDeploy はルール単位では動けない。ルールは既定より先に評価されるため、
  # あのルールを残したまま CodeDeploy に繋ぐと「デプロイは成功するのにトラフィックが
  # 一切切り替わらない」という壊れ方をする。→ ADR-0013
  #
  # 【ホスト名による絞り込みを再現していない理由】
  # ALB の DNS 名(*.elb.amazonaws.com)や IP を直接叩かれても、この構成では失うものが無い。
  #   - 前段に CloudFront が無い(CloudFront は画像専用)ので、迂回されて困る層が存在しない。
  #     実務で ALB 直アクセスを塞ぐのは CloudFront が前段にある構成で、しかも手段は
  #     オリジンカスタムヘッダーの検証やマネージドプレフィックスリストであって WAF ではない
  #   - ALB の DNS 名や IP で HTTPS を叩くと証明書名が一致しない。ALB は SNI が一致しなくても
  #     デフォルト証明書でハンドシェイクを完了するので「ALB が弾く」わけではないが、
  #     証明書を検証するクライアント(ブラウザ・クローラ)は中身を取れない。
  #     したがってインデックスもされず、SEO 上の実害も無い(curl -k なら通る)
  #   - stg は WAF の Basic 認証が全リクエストに掛かる。prod はそもそもアプリを公開している
  # なお ALB のリスナールール条件に否定形は無いので「想定ホスト名でなければ 403」は書けない。
  # *.elb.amazonaws.com を弾く肯定形のルールなら書けるが、IP 直アクセスは Host が IP になるため
  # 拾えず、中途半端な防御になる。完全にやるなら WAF の NotStatement だけが手段になる。
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  # ===========================================================================
  # WAF(Basic 認証)
  # ===========================================================================
  # ALB のリスナールールでは実現できない。fixed-response が WWW-Authenticate ヘッダーを
  # 付けられず、ブラウザが認証ダイアログを出さないため。WAF のカスタムレスポンスなら
  # 任意のヘッダーを付けられる。→ docs/adr/0006
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: BasicAuthEnabled
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-basic-auth
      # ALB は REGIONAL。CLOUDFRONT スコープの Web ACL は us-east-1 にしか作れない
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${ProjectName}-${EnvName}-basic-auth
        SampledRequestsEnabled: true
      Rules:
        - Name: RequireBasicAuth
          Priority: 0
          Statement:
            NotStatement:
              Statement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: authorization
                  PositionalConstraint: EXACTLY
                  # Terraform の base64encode(var.basic_auth_credential) に相当。
                  # !Base64 !Ref と短縮形を 2 つ重ねられない(YAML が 1 ノードに
                  # タグを 2 つ許さない)ので Fn::Base64 は長い形式で書く。
                  # このプロパティは {{resolve:ssm-secure:...}} の対応表に無いので、
                  # SSM の SecureString からは渡せない(→ Parameters の BasicAuthCredential)。
                  SearchString: !Sub
                    - Basic ${b64}
                    - b64:
                        Fn::Base64: !Ref BasicAuthCredential
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          Action:
            Block:
              CustomResponse:
                ResponseCode: 401
                ResponseHeaders:
                  - Name: www-authenticate
                    Value: Basic realm="restricted"
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RequireBasicAuth
            SampledRequestsEnabled: true
      # マネージドルールは入れない。フェーズ8 の検索ラボが SQL に似たキーワードを送るので
      # SQLi のルールに引っかかって検証が壊れる。

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: BasicAuthEnabled
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  # ===========================================================================
  # IAM(ECS)
  # ===========================================================================
  # 実行ロール: ECR から pull し、ログを書き、secrets を読む。コンテナの中身は使わない。
  # アプリと db-migrate が共有する。**RDS のマスターシークレットはここに入れない**
  # (共有ロールに入れると、アプリのタスク定義からもマスターの値を注入できてしまう)。
  # マスターを読むのは db-ops 専用の DbOpsExecutionRole だけ → docs/adr/0005
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-task-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SSM の SecureString(手動作成の 4 つ)。既定の aws/ssm キーで暗号化されているので
              # kms:Decrypt を明示する必要はない
              - Sid: SsmSecureStrings
                Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}*

  # タスクロール: アプリ自身が使う権限。
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # メール送信。SMTP 認証を使わないので IAM ユーザーも長期クレデンシャルも要らない
              - Sid: SendEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${EmailIdentity}
              # 画像(フェーズ6)
              - Sid: ImageObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${ImageBucket.Arn}/*
              - Sid: ImageBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ImageBucket.Arn
              # ECS Exec(コンテナに入って調査する)。ssmmessages はリソース単位に縛れない
              - Sid: EcsExec
                Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  # db-ops タスク専用の実行ロール。**RDS のマスターシークレットを読めるのはこのロールだけ**で、
  # ADR 0005 の「マスター資格情報に触るのは db-ops タスクだけ」を IAM の単位で成立させている。
  # タスクロールではなく実行ロールを分けるのは、secrets を取ってコンテナに渡すのが
  # コンテナ自身ではなく ECS エージェント(= 実行ロール)だから。
  DbOpsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-db-ops-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDbSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # このタスクが注入するのは DB のパスワード 2 つだけ。Google の値は要らないので
              # 共有ロールのようなパスのワイルドカードにしない
              - Sid: DbPasswords
                Effect: Allow
                Action:
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}app_db_password
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}migrate_db_password
              # CREATE USER / GRANT をマスターで流すために要る
              - Sid: RdsMasterSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  # CodeDeploy が ECS のタスクセットを作り、ALB のリスナーを付け替えるために引き受けるロール。
  # ネイティブ Blue/Green のときは ECS 自身がリスナールールの重みを書き換えていたので
  # AmazonECSInfrastructureRolePolicyForLoadBalancers を ecs.amazonaws.com に渡していたが、
  # CODE_DEPLOY 制御では切り替えの主体が CodeDeploy に移る(→ ADR-0013)。
  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-codedeploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  # ===========================================================================
  # ECS
  # ===========================================================================
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub ${ProjectName}-${EnvName}-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: !Ref ContainerInsights
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  # アプリのタスク定義。Flyway は走らせない(FLYWAY_ENABLED=false)。
  #
  # 【この定義は初回構築でだけ使われる】
  # 2 代目以降は taskdef.json(リポジトリ直下)が正で、CodePipeline の Deploy アクションが
  # そこから新しいリビジョンを register する。ここを消せないのは AWS::ECS::Service が
  # タスク定義の指定を必須にしているからで、WebDesiredCount=0 で作る 1 段目でも要る。
  #
  # **環境変数・Secrets・CPU/メモリを変えるときは taskdef.json も必ず揃えること。**
  # 片方だけ直すと「構築直後の初回起動だけ古い定義で立ち上がってクラッシュする」という
  # 気づきにくい壊れ方をする(スタックは緑、パイプラインも緑、最初のタスクだけ落ちる)。
  # → ADR-0013 の「結果として生じること」1
  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${EnvName}-app
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref WebCpu
      Memory: !Ref WebMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}:${ImageTag}
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: DB_USER
              Value: !Ref DbAppUsername
            # マイグレーションは db-migrate タスクが済ませている
            - Name: FLYWAY_ENABLED
              Value: "false"
            # メール本文のリンクと Google の redirect_uri の組み立てに使う。
            # Google Cloud Console の承認済みリダイレクト URI にも
            # <この値>/api/login/oauth2/code/google を登録しておく必要がある
            - Name: APP_BASE_URL
              Value: !Sub https://${EnvName}.${AppSubdomain}.${DomainName}
            - Name: MAIL_TRANSPORT
              Value: ses
            - Name: MAIL_FROM
              Value: !Sub no-reply@${EnvName}.${AppSubdomain}.${DomainName}
            - Name: S3_BUCKET
              Value: !Ref ImageBucket
            - Name: IMAGE_CDN_DOMAIN
              Value: !GetAtt ImageDistribution.DomainName
          Secrets:
            # DB_USER は app なので、パスワードも app ユーザーのもの(SSM の SecureString)。
            # RDS のマスターパスワードはこのタスクには渡らない(→ docs/adr/0005)
            - Name: DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}app_db_password
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}google_client_id
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}google_client_secret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  # マイグレーション用。同じイメージを APP_TASK=migrate で起動し、
  # Flyway を流して終了する。DDL 権限を持つ migrate ユーザーを使う。
  #
  # 【こちらも初回構築でだけ使われる】
  # 2 代目以降は taskdef-migrate.json が正で、CodeBuild が register する
  # (CodeDeploy の Deploy アクションはアプリのタスク定義しか面倒を見ない)。
  # db-task.yml は Outputs の family 名を run-task するので、リビジョンを省略した
  # 「最新 ACTIVE」= パイプラインが作った新しいイメージのものが使われる。
  # AppTaskDefinition と同じく、変えるときは taskdef-migrate.json も揃えること。
  MigrateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${EnvName}-db-migrate
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      # アプリの権限は要らない(SES も S3 も触らない)。ロールを分けたいところだが、
      # 実行ロールと違いタスクロールは省略できるので付けない。
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepositoryName}:${ImageTag}
          Essential: true
          Environment:
            - Name: APP_TASK
              Value: migrate
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: !Ref DbName
            # datasource は app ユーザー(JPA の validate に使う)、Flyway だけ migrate ユーザー
            - Name: DB_USER
              Value: !Ref DbAppUsername
            - Name: FLYWAY_ENABLED
              Value: "true"
            - Name: FLYWAY_DB_USER
              Value: !Ref DbMigrateUsername
            # Web を立てるが ALB には登録されないので、ポートは何番でもよい
            - Name: SERVER_PORT
              Value: "8080"
          Secrets:
            # migrate のパスワードだけでは起動しきらないので app のパスワードも渡す。
            # spring.flyway.user を設定すると Spring は Flyway 用に別の非プール DataSource を
            # 作るので(FlywayAutoConfiguration#getMigrationDataSource)、migrate ユーザーを
            # 使うのは Flyway だけで、プライマリの datasource は app ユーザーのまま残る。
            # そのプライマリはこのタスクでも実際に接続する。ddl-auto: validate が
            # EntityManagerFactory の初期化中にスキーマとエンティティを突き合わせるため。
            # 結果としてこのタスク 1 回で、DDL の適用・app ユーザーの GRANT が効いていること・
            # エンティティとスキーマの一致まで確認できる(Blue/Green の切替より前に落ちる)
            - Name: DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}app_db_password
            - Name: FLYWAY_DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}migrate_db_password
            # Google の資格情報は渡さない。このタスクは HTTP を受けないので、
            # application.yml のダミー既定値(dummy-client-id / dummy-client-secret)で
            # ClientRegistration が組み立てられて起動できる。
            # 代わりに、OAuth の設定値はこのタスクでは検証されない
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: db-migrate

  # DB の管理操作(ユーザー作成と任意 SQL)。mysql の公式イメージ(AWS のミラー)を使い、
  # command を上書きして SQL を流すだけのタスクにする。
  # SQL を command に埋め込まず環境変数で渡すのは、引用符と改行のエスケープで壊れないため。
  #
  # 名前を「用途(db-ops)」で付け、道具の名前(mysql)はコンテナ名にだけ置いている。
  # db-migrate タスクも同じ MySQL に繋ぐので、mysql では 2 つを区別できないため。
  DbOpsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${ProjectName}-${EnvName}-db-ops
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt DbOpsExecutionRole.Arn
      # タスクロールは持たない。コンテナは mysql クライアントを走らせるだけで AWS を呼ばない
      ContainerDefinitions:
        - Name: mysql
          # Docker Hub は匿名 pull にレート制限があるので AWS のミラーを使う
          Image: public.ecr.aws/docker/library/mysql:8
          Essential: true
          EntryPoint: [sh, -c]
          # 環境変数 SQL が空なら「ユーザー作成」、入っていればその SQL を流す。
          # db-task.yml は action=sql のとき containerOverrides で SQL と SQL_USER を渡す。
          #
          # ユーザー作成の SQL をここ(シェルのダブルクォート内)で組み立てているのは、
          # 環境変数 SQL の中に $APP_DB_PASSWORD と書いても展開されないため。
          # "$SQL" を展開した結果の文字列は再展開されないので、パスワードが
          # リテラルのまま mysql に渡ってしまう。
          #
          # 実行ユーザーを secrets ではなく環境変数 SQL_USER で選ばせているのは、
          # ECS の containerOverrides が environment と command は上書きできるが
          # secrets は上書きできないため。
          #
          # パスワードは MYSQL_PWD で渡す(--password= だとプロセス一覧に出る)。
          #
          # 注意: パスワードは SQL の文字列リテラルに埋め込まれる。SSM に置く値に
          # シングルクォートとバックスラッシュを使わないこと。
          Command:
            - !Sub |
              set -eu
              if [ "${!SQL_USER:-master}" = "app" ]; then
                RUN_USER="${DbAppUsername}"
                MYSQL_PWD="$APP_DB_PASSWORD"
              else
                RUN_USER="$MASTER_USER"
                MYSQL_PWD="$MASTER_PASSWORD"
              fi
              export MYSQL_PWD
              if [ -n "${!SQL:-}" ]; then
                echo "任意 SQL を ${!RUN_USER} で実行します"
                exec mysql --host="$DB_HOST" --port="$DB_PORT" --user="$RUN_USER" --batch --table --execute="$SQL"
              fi
              echo "app / migrate ユーザーを作成します"
              exec mysql --host="$DB_HOST" --port="$DB_PORT" --user="$RUN_USER" --batch --execute="
                CREATE USER IF NOT EXISTS '${DbAppUsername}'@'%' IDENTIFIED BY '$APP_DB_PASSWORD';
                ALTER USER '${DbAppUsername}'@'%' IDENTIFIED BY '$APP_DB_PASSWORD';
                GRANT SELECT, INSERT, UPDATE, DELETE ON \`${DbName}\`.* TO '${DbAppUsername}'@'%';
                CREATE USER IF NOT EXISTS '${DbMigrateUsername}'@'%' IDENTIFIED BY '$MIGRATE_DB_PASSWORD';
                ALTER USER '${DbMigrateUsername}'@'%' IDENTIFIED BY '$MIGRATE_DB_PASSWORD';
                GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX, REFERENCES ON \`${DbName}\`.* TO '${DbMigrateUsername}'@'%';
                FLUSH PRIVILEGES;
              "
          Environment:
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            # 以下 2 つは db-task.yml が action=sql のとき containerOverrides で上書きする
            - Name: SQL
              Value: ""
            - Name: SQL_USER
              Value: master
          Secrets:
            - Name: MASTER_USER
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::'
            - Name: MASTER_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
            - Name: APP_DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}app_db_password
            - Name: MIGRATE_DB_PASSWORD
              ValueFrom: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}migrate_db_password
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: db-ops

  Service:
    Type: AWS::ECS::Service
    # TaskDefinition を !Ref から family 名の固定文字列に変えた結果、CloudFormation が
    # 依存関係を推論できなくなった(参照が無いので暗黙の依存も無い)。明示しないと
    # タスク定義と並列に作られ、まだ存在しない family を参照して失敗する。
    # タイミング次第で成否が変わるので、通ってしまう回もある。
    DependsOn: AppTaskDefinition
    Properties:
      ServiceName: !Sub ${ProjectName}-${EnvName}-app
      Cluster: !Ref Cluster
      # 【リビジョンを指定しない】
      # CODE_DEPLOY 制御のサービスに対して、ECS の UpdateService はタスク定義の更新を
      # 受け付けない(Unable to update task definition on services with a CODE_DEPLOY
      # deployment controller. Use AWS CodeDeploy to trigger a new deployment)。
      # 受け付けるのは desired count / deployment configuration / grace period /
      # 配置制約 / タグだけ。
      #
      # !Ref AppTaskDefinition のままにすると ImageTag を変えるたびに新しいリビジョン ARN が
      # 渡り、スタック更新が必ず落ちる。family だけを書けばテンプレート上の値が不変になり、
      # 実際にどのリビジョンが動くかは CodeDeploy が決める。
      # これは ADR-0007 が「タスク定義の所有者が 2 つになる」として退けた形だが、
      # CodeDeploy を使う以上ほかに選択肢が無い。→ ADR-0013
      TaskDefinition: !Sub ${ProjectName}-${EnvName}-app
      DeploymentController:
        Type: CODE_DEPLOY
      DesiredCount: !Ref WebDesiredCount
      EnableExecuteCommand: true
      # stg: [FARGATE_SPOT(1)] / prod: [FARGATE(base 2, weight 0), FARGATE_SPOT(1)]
      CapacityProviderStrategy:
        - !If
          - UseOnDemand
          - CapacityProvider: FARGATE
            Base: !Ref WebOnDemandBase
            Weight: !Ref WebOnDemandWeight
          - !Ref AWS::NoValue
        - CapacityProvider: FARGATE_SPOT
          Weight: !Ref WebSpotWeight
      # DeploymentConfiguration は書かない。Strategy / BakeTimeInMinutes /
      # DeploymentCircuitBreaker はどれも ECS コントローラ専用で、CODE_DEPLOY では使えない
      # (MinimumHealthyPercent と MaximumPercent も CODE_DEPLOY では参照されない)。
      # 切替方式・待ち時間・自動ロールバックは CodeDeployDeploymentGroup が持つ。
      # Spring Boot の起動に 30〜60 秒かかる。短いと起動途中に殺され続ける
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetC
          SecurityGroups:
            - !Ref EcsSecurityGroup
          AssignPublicIp: DISABLED
      # AdvancedConfiguration(AlternateTargetGroupArn / ProductionListenerRule / RoleArn)は
      # ネイティブ Blue/Green 専用なので書かない。green 側のターゲットグループと、
      # 付け替える対象のリスナーは CodeDeployDeploymentGroup の LoadBalancerInfo が持つ。
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroupBlue

  # DesiredCount が 0 の段では作らない(Condition)。
  # 作ってしまうと Application Auto Scaling が MinCapacity まで増やしてしまい、
  # ユーザーがまだ存在しない DB につなごうとしてクラッシュループする。
  #
  # 【ResourceId が Service を参照している理由 — 一度やめて、戻した】
  # ここは `!Sub service/${Cluster}/${ProjectName}-${EnvName}-app` という静的な文字列に
  # 書き換えてあった。cfn-apply.yml でイメージを更新していた頃、次の連鎖でイメージ更新の
  # たびに Replacement ガードに止められたため。
  #
  #   1. ImageTag を変える → タスク定義は 19 プロパティ中 17 が createOnly なので
  #      AppTaskDefinition / MigrateTaskDefinition が必ず Replacement: True になる
  #      (これ自体は新リビジョンの登録なので無害。ガードも型ごと除外している)
  #   2. Service が `TaskDefinition: !Ref AppTaskDefinition` で新しい ARN を受けるため、
  #      Service も毎回 Modify に入る
  #   3. Change Set は「更新対象に入っているリソースの Ref / GetAtt」を実行時まで
  #      解決しない(Evaluation: Dynamic)。よって Service.Name も Dynamic 扱いになる
  #   4. ResourceId は createOnlyProperty(変わるなら作り直すしかない)。
  #      Dynamic x RequiresRecreation: Always = Replacement: Conditional が付く
  #   5. ScalingPolicy 2 本は `ScalingTargetId: !Ref ScalableTarget` なので芋づるで Conditional
  #
  # 【CodeDeploy に移って 2 が消えたので、参照に戻した】
  # Service.TaskDefinition は family 名の固定文字列になり(→ 上の Service のコメントと ADR-0013)、
  # ImageTag を変えても Service はもう Modify に入らない。そもそも通常のリリースは
  # CodePipeline の仕事で、CloudFormation を通らない。連鎖の 2 が切れたので 3 以降も起きない。
  # この回避が要るのは、cfn-apply.yml でイメージを更新している github-actions-deploy 側だけ。
  #
  # 【それでも残る代償 — Service を編集する更新では今も止まる】
  # WebDesiredCount を変えるなど Service 自身に手を入れる更新では、今でも Service が Modify に
  # 入るので 4 の Conditional が出てガードに止まる。そのときは allow_replacement=true で通す。
  # 「イメージ更新のたび」だった頃と違って意図してサービスを触ったときだけなので、
  # 反射で解除する手順にはならない(ガードが形骸化するという当初の懸念はここで解ける)。
  # なお構築フロー(cfn-deploy.yml)の 4 段目で WebDesiredCount が 0 → 1 になるときは、
  # Condition が偽から真に変わるので ScalableTarget は Add で入る。Replacement は出ない。
  #
  # 【静的値 → 参照の書き換え自体が一度だけ Conditional を出す】
  # 解決後の値が同じでも CloudFormation は書き換えを変更として扱う。移行のときだけ
  # allow_replacement=true が要る(または撤収して建て直す。新規作成なら Add なので出ない)。
  #
  # DependsOn: Service は消した。参照が戻ったので暗黙の依存も戻っている。
  # → 依存の話は docs/notes/cloudformation/terraform-to-cloudformation.md §4-5
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: ServiceEnabled
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !Ref WebMinCapacity
      MaxCapacity: !Ref WebMaxCapacity

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ServiceEnabled
    Properties:
      PolicyName: !Sub ${ProjectName}-${EnvName}-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref WebCpuTarget
        ScaleInCooldown: !Ref WebCpuScaleInCooldown
        ScaleOutCooldown: !Ref WebCpuScaleOutCooldown

  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ServiceEnabled
    Properties:
      PolicyName: !Sub ${ProjectName}-${EnvName}-memory-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref WebMemoryTarget
        ScaleInCooldown: !Ref WebMemoryScaleInCooldown
        ScaleOutCooldown: !Ref WebMemoryScaleOutCooldown

  # ===========================================================================
  # CodeDeploy(アプリのデプロイ)
  # ===========================================================================
  # 方針 → docs/adr/0013-app-deploy-with-code-services.md
  # 設計 → docs/superpowers/specs/2026-09-05-phase16-codepipeline-design.md
  #
  # 【パイプライン本体はここに無い】
  # CodePipeline と CodeBuild は常駐の別スタック cloudformation/pipeline.yml にある。
  # ここに置くのは DeploymentGroup だけで、理由は ALB のリスナー ARN と ECS サービスを
  # 参照する必要があるため。リスナー ARN は生成 ID を含むので命名規則では組み立てられない。
  #
  # 逆に、パイプライン側の Deploy アクションが必要とするのは ApplicationName と
  # DeploymentGroupName という文字列だけで、これは ${ProjectName}-${EnvName}-... で予測できる。
  # だから Export / ImportValue は使わない(エクスポート元は参照側が消えるまで削除できず、
  # 「全部まとめて建てて全部まとめて消す」撤収運用と正面衝突する → ADR-0007)。
  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub ${ProjectName}-${EnvName}-app
      ComputePlatform: ECS

  # 【ドキュメントの注意書きに引っかからないこと】
  # AWS::CodeDeploy::DeploymentGroup のリファレンス冒頭には
  #   "Amazon ECS blue/green deployments through CodeDeploy do not use the
  #    AWS::CodeDeploy::DeploymentGroup resource. ... use the AWS::CodeDeploy::BlueGreen hook."
  # と書かれているが、これは「CloudFormation のスタック更新として ECS の Blue/Green
  # デプロイを *実行* する」話であって、デプロイグループを *作る* 話ではない。
  # ECS 用の ECSServices と LoadBalancerInfo.TargetGroupPairInfoList という
  # プロパティが存在すること自体がその証拠で、CDK の EcsDeploymentGroup も
  # このリソースをそのまま合成する。
  #
  # そして AWS::CodeDeploy::BlueGreen フックのほうは、ADR-0007 が
  # 「タスク定義の更新と他リソースの更新を同一スタック更新に混ぜられない」という理由で
  # 退けたもの。ここで採っているのは「デプロイグループを作り、デプロイは
  # CodePipeline から CodeDeploy に依頼する」形なので、その制約とは無関係。
  CodeDeployDeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    # DependsOn は書かない。ECSServices と LoadBalancerInfo が Service と
    # TargetGroup を参照しているので、作成順はそこから自動で組まれる
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub ${ProjectName}-${EnvName}-app-dg
      ServiceRoleArn: !GetAtt CodeDeployServiceRole.Arn
      # 【最小構成にしてある】
      # 段階的なトラフィック移行(CodeDeployDefault.ECSCanary10Percent5Minutes など)と
      # CloudWatch アラーム連動(DEPLOYMENT_STOP_ON_ALARM)は意図的に入れていない。
      # 入れるときは DeploymentConfigName と AutoRollbackConfiguration を差し替えるだけで済む。
      # 今の設定は「全タスクを一度に切り替え、成功したら blue を待たずに終了する」。
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
      BlueGreenDeploymentConfiguration:
        # CONTINUE_DEPLOYMENT は「green が healthy になったらすぐ本番トラフィックを移す」。
        # STOP_DEPLOYMENT にすると切替の直前で止まり、人が continue-deployment を呼ぶまで待つ
        # (コンソールの「トラフィックの再ルーティング」も CLI / SDK もこの API)。
        # つまり承認ゲートとしては使えるが、採らない理由が 2 つある。
        #   1. 確認する手段が無い。TestTrafficRoute を作っていないので、待っている間 green に
        #      接続できない(→ 下の LoadBalancerInfo のコメント)。見ないまま承認するだけになる
        #   2. 承認は Build と Deploy の間(パイプラインの Approve ステージ)に既にある。
        #      ここでも止めると窓口が二重になり、しかも CodeDeploy 側の待ちは
        #      WaitTimeInMinutes を過ぎると中止扱いになるので、承認忘れが失敗として残る
        # なお appspec の Hooks は Lambda でしか実装できないので、ライフサイクルの任意の位置に
        # 「人に聞く」ステップを差し込むことはできない。人を待たせられるのは切替の直前だけ。
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 0
      # ここも ScalableTarget と同じ理由で静的な文字列にしていたが、Service がイメージ更新で
      # Modify に入らなくなったので参照に戻した(→ ScalableTarget の長いコメント)。
      # なお ECSServices と LoadBalancerInfo はどちらも更新可能プロパティなので、仮に
      # Dynamic 扱いになっても Replacement: False どまりで、そもそもガードには止められない。
      # createOnly な ScalableTarget.ResourceId とはそこが違う。
      ECSServices:
        - ClusterName: !Ref Cluster
          ServiceName: !GetAtt Service.Name
      # 【ListenerArns はリスナー ARN のみ。リスナールール ARN は渡せない】
      # 「The Amazon Resource Name (ARN) of one listener.」と定義されており、配列だが最大 1 個。
      # CodeDeploy はこのリスナーの既定アクションを blue と green の間で書き換える。
      # TestTrafficRoute(切替前に green だけを叩けるリスナー)は作っていない。
      # これを足して DeploymentReadyOption を STOP_DEPLOYMENT にすれば、Lambda を書かずに
      # 「人が green を確認してから切り替える」にできる。ただしリスナーを 1 本増やし、
      # ALB のセキュリティグループ(80 と 443 だけ)にも口を開けたうえで、承認の窓口が
      # 二重になる。作り捨ての検証環境では割に合わないので、今は採らない。
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - !Ref HttpsListener
            # 【ここが要求するのは ARN ではなく「名前」】
            # TargetGroupInfo.Name はターゲットグループ名で、!Ref が返す ARN とは別物。
            # 名前を返すのは TargetGroupName 属性なので !GetAtt を使う。
            # すぐ上の ListenerArns が !Ref で書けているのは、あちらが ARN を要求しているから。
            TargetGroups:
              - Name: !GetAtt TargetGroupBlue.TargetGroupName
              - Name: !GetAtt TargetGroupGreen.TargetGroupName

  # ===========================================================================
  # 監視・検知(SNS + CloudWatch アラーム + RDS イベント購読)
  # ===========================================================================
  # 設計 → docs/superpowers/specs/2026-08-28-phase14-monitoring-design.md
  # 方針 → docs/adr/0010-monitoring-in-ephemeral-stack.md
  #
  # 【前提】これは「常時稼働する stg」を前提に書かれた検知層を、作り捨ての環境に
  # そのまま移植したもの。生じる不整合は構成を歪めて解決せず、運用で吸収する。
  # 受け入れている帰結は 3 つ。詳細は ADR-0010。
  #   1. 建てるたびに「OK になりました」通知が 7 通届く
  #      (新規アラームは INSUFFICIENT_DATA -> OK も状態遷移なので OKActions が発火する)
  #   2. ログアーカイブは撤収のたびに全部消える。保全機能としては動いていない
  #   3. スロークエリのアラームはフェーズ8・10 の実験中に鳴り続ける
  #
  # ADR-0010 が受け入れていた帰結がもう 1 つ(建てるたびに SNS の購読確認メールを
  # 2 通踏む)あったが、通知先を Slack に移して解消した。→ docs/adr/0011
  # ===========================================================================

  # --- SNS ---------------------------------------------------------------
  # トピックを 2 本に分けているのは Terraform 側と 1 対 1 に対応させるため。
  # 1 トピック = 1 Slack チャンネルに対応する(下の Chatbot 設定で紐づける)。
  #
  # 購読(AWS::SNS::Subscription)はもう無い。Chatbot のチャンネル設定が自分自身を
  # トピックに購読させるため、テンプレートに購読を書く必要がない。
  # email の購読をやめた理由 → docs/adr/0011。PendingConfirmation のまま作られ、
  # 確認リンクを踏むまで 1 通も届かないのにスタックは緑になる、という壊れ方をしていた。
  EcsTaskShortageTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${EnvName}-ecs-task-shortage
      DisplayName: !Sub ${ProjectName}-${EnvName} ECS

  # RDS の 3 系統(ログ由来 / メトリクス / イベント購読)をこの 1 本に集約する
  RdsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${EnvName}-rds-alerts
      DisplayName: !Sub ${ProjectName}-${EnvName} RDS

  # トピックポリシーは付けない。CloudWatch アラームと RDS イベント購読は
  # 同一アカウント内なら既定のトピックポリシーで publish できる。

  # --- Slack への転送(Amazon Q Developer in chat applications)-------------
  # 旧名 AWS Chatbot。CloudFormation の Type 名は AWS::Chatbot::... のまま。
  # 設計 → docs/adr/0011、Slack 側の手順 → docs/slack/README.md
  #
  # 【前提】Slack ワークスペースの認可はコンソールでしか行えない(CloudFormation 不可)。
  # 認可していないワークスペース ID を渡すとスタックの作成が失敗する。
  # 認可自体は 1 回きりで、スタックを作り直しても消えない常駐の設定。
  #
  # 【チャンネル設定をスタック内に置いている理由】常駐にできないため。
  # 設定は対象トピックに自分自身を購読させる形で動くので、撤収でトピックが消えると
  # 購読も失われる。トピック名は固定なので次に建てても ARN は同じだが、Chatbot 側から
  # 繋ぎ直すまで無音になる(ADR-0010 の帰結 1 が形を変えて再発する)。
  #
  # Chatbot の API エンドポイントは us-east-2 の 1 本しかなく、ap-northeast-1 の
  # スタックから作っても内部的にそちらを呼ぶ。リージョンを合わせる必要はない。
  ChatbotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-chatbot-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: chatbot.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # AWS が用意する AWS-Chatbot-NotificationsOnly-Policy と同じ内容。
        # 通知の転送に必要な最小限で、アラーム通知にグラフを添えるための読み取りだけ。
        - PolicyName: NotificationsOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                Resource: "*"

  # 【重要】GuardrailPolicies を省略すると AdministratorAccess が既定で適用される。
  # これはチャンネルのメンバーが Slack から AWS に対して実行できる操作の上限で、
  # 通知を受け取るだけなら権限は一切要らない。明示的に全拒否する。
  #
  # ConfigurationName はアカウント内で一意でなければならず、変更すると作り直しになる。
  EcsTaskShortageSlackChannel:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: !Sub ${ProjectName}-${EnvName}-ecs-task-shortage
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SlackChannelId: !Ref SlackChannelIdEcs
      SnsTopicArns:
        - !Ref EcsTaskShortageTopic
      IamRoleArn: !GetAtt ChatbotRole.Arn
      GuardrailPolicies:
        - arn:aws:iam::aws:policy/AWSDenyAll
      UserRoleRequired: false
      # 転送に失敗した理由が /aws/chatbot/<ConfigurationName> に出る。実機で一度も
      # 動かしていないので ERROR にしてある(NONE にすると「届かない」ときに手掛かりが無くなる)。
      #
      # 【このロググループはスタックの外にある】
      # Chatbot が自分で作る。しかも作られるのは us-east-1 で、このスタックのリージョン
      # (ap-northeast-1)ではない。撤収しても残り、保持期間は既定の無期限。
      # NONE にしても消えない(コマンド実行の監査ログは常時有効で無効化できない)。
      # → docs/slack/README.md §8-2
      LoggingLevel: ERROR

  RdsAlertsSlackChannel:
    Type: AWS::Chatbot::SlackChannelConfiguration
    Properties:
      ConfigurationName: !Sub ${ProjectName}-${EnvName}-rds-alerts
      SlackWorkspaceId: !Ref SlackWorkspaceId
      SlackChannelId: !Ref SlackChannelIdRds
      SnsTopicArns:
        - !Ref RdsAlertsTopic
      IamRoleArn: !GetAtt ChatbotRole.Arn
      GuardrailPolicies:
        - arn:aws:iam::aws:policy/AWSDenyAll
      UserRoleRequired: false
      LoggingLevel: ERROR

  # --- D: ECS タスク数不足(Metric Math) ---------------------------------
  # RunningTaskCount < DesiredTaskCount なら 1、そうでなければ 0 を返す式を作り、
  # その式の結果だけを閾値 1 と比較する。
  # 2 つの生メトリクスは計算材料なので ReturnData: false。判定対象はちょうど 1 つでなければならない。
  #
  # DesiredCount が 0 の段(1〜3 段目)では 0 < 0 が偽になるので鳴らない。
  EcsRunningLessThanDesiredAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-ecs-running-less-than-desired
      AlarmDescription: ECS service running tasks is less than desired tasks
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      # メトリクス未取得で誤爆しないように
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref EcsTaskShortageTopic
      OKActions:
        - !Ref EcsTaskShortageTopic
      # ServiceName の次元も静的な文字列にしていた。あちらはガードの話ではなく
      # 「実質何も変わらないアラームがイメージ更新のたびに差分表へ並ぶと、差分を読む価値が
      # 下がる」というノイズ対策だったが、Service が Modify に入らなくなってノイズ自体が
      # 出なくなったので参照に戻した(→ ScalableTarget の長いコメント)。
      # 次元は更新可能プロパティなので、Dynamic 扱いになっても Replacement: False どまり。
      Metrics:
        - Id: m_running
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: RunningTaskCount
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Cluster
                - Name: ServiceName
                  Value: !GetAtt Service.Name
            Period: 60
            Stat: Minimum
        - Id: m_desired
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: ECS/ContainerInsights
              MetricName: DesiredTaskCount
              Dimensions:
                - Name: ClusterName
                  Value: !Ref Cluster
                - Name: ServiceName
                  Value: !GetAtt Service.Name
            Period: 60
            Stat: Minimum
        - Id: e_shortage
          ReturnData: true
          Label: running < desired
          Expression: IF(m_running < m_desired, 1, 0)

  # --- A: RDS メトリクスアラーム 4 本 -------------------------------------
  # 評価は AWS 公式推奨どおり「60 秒 x 5 データポイント連続」。一過性のスパイクで鳴らさない。
  RdsCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-rds-cpu-high
      AlarmDescription: RDS CPUUtilization is too high (burst credit exhaustion / runaway query)
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 60
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref RdsCpuThresholdPercent
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RdsAlertsTopic
      OKActions:
        - !Ref RdsAlertsTopic

  # ストレージ枯渇は DB 停止に直結するので、悪化方向に安全側の Minimum で評価する
  RdsFreeStorageLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-rds-free-storage-low
      AlarmDescription: RDS FreeStorageSpace is running low (risk of DB stopping)
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Minimum
      Period: 60
      ComparisonOperator: LessThanThreshold
      Threshold: !Ref RdsFreeStorageThresholdBytes
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RdsAlertsTopic
      OKActions:
        - !Ref RdsAlertsTopic

  RdsFreeableMemoryLowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-rds-freeable-memory-low
      AlarmDescription: RDS FreeableMemory is running low (swap / OOM precursor)
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 60
      ComparisonOperator: LessThanThreshold
      Threshold: !Ref RdsFreeableMemoryThresholdBytes
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RdsAlertsTopic
      OKActions:
        - !Ref RdsAlertsTopic

  RdsConnectionsHighAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-rds-connections-high
      AlarmDescription: RDS DatabaseConnections near max_connections (connection leak / pool exhaustion)
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database
      Statistic: Average
      Period: 60
      ComparisonOperator: GreaterThanThreshold
      Threshold: !Ref RdsConnectionsThreshold
      EvaluationPeriods: 5
      DatapointsToAlarm: 5
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RdsAlertsTopic
      OKActions:
        - !Ref RdsAlertsTopic

  # --- B: RDS ログ由来のメトリクスとアラーム ------------------------------
  # 名前空間に EnvName を含めているのは、メトリクスフィルタの出力にディメンションが
  # 無いため。含めないと stg と prod の値が同じメトリクスに合算される。
  # (参考にした Terraform 側は project_name 自体が "practice-stg" と環境名込みなので、
  #  これは形を変えたのではなく同じ挙動に揃えたもの)
  #
  # エラーログ: 深刻度タグ [ERROR] の行だけ数える。
  # エラーログは名前に反してエラー以外も流れる。起動・シャットダウン・InnoDB 初期化などは
  # [System] / [Note]、軽微な警告は [Warning] で出るので、正常稼働中は [ERROR] が出ない。
  # つまり「ログは流れているのにメトリクスが出ない」のが正常。
  # フィルタ構文では引用符なしの [...] は「スペース区切りのフィールド分解」という別機能に
  # なってしまうので、リテラルとして扱うには引用符で囲んだタームにする。
  RdsErrorLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: !Sub ${ProjectName}-${EnvName}-rds-error-log
      LogGroupName: !Ref RdsErrorLogGroup
      FilterPattern: '"[ERROR]"'
      MetricTransformations:
        # MetricValue を固定の 1 にすることで「1 件マッチ = 1」の件数カウントになる
        # (アラーム側は Sum で合計して件数を判定する)
        - MetricName: RdsErrorLogCount
          MetricNamespace: !Sub ${ProjectName}-${EnvName}/RDS
          MetricValue: "1"

  # スロークエリ: 1 エントリが複数行(# Time: / # User@Host: / # Query_time: / SQL 本文)に
  # またがるので、行数ではなくエントリごとに 1 回だけ出る「# Query_time:」を数える
  RdsSlowQueryMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: !Sub ${ProjectName}-${EnvName}-rds-slowquery-log
      LogGroupName: !Ref RdsSlowQueryLogGroup
      FilterPattern: '"# Query_time:"'
      MetricTransformations:
        - MetricName: RdsSlowQueryCount
          MetricNamespace: !Sub ${ProjectName}-${EnvName}/RDS
          MetricValue: "1"

  # エラーは 1 件でも異常なので「5 分間に 1 件以上」で即通知
  RdsErrorLogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-rds-error-log
      AlarmDescription: RDS error log contains [ERROR] entries
      Namespace: !Sub ${ProjectName}-${EnvName}/RDS
      MetricName: RdsErrorLogCount
      Statistic: Sum
      Period: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 1
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      # メトリクスフィルタはマッチが無いとデータ自体を出さないので、データ無し = 正常
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RdsAlertsTopic
      OKActions:
        - !Ref RdsAlertsTopic

  # スロークエリは 1 件ごとに通知するとアラート疲れを起こすので「5 分間に 5 件以上」の急増だけ拾う。
  # どの SQL が遅いかは通知後に CloudWatch Logs Insights で見に行く(stg は Performance Insights 非対応)。
  #
  # 【既知の衝突】フェーズ8(検索ラボ)とフェーズ10(index 実験)は、100 万件の posts に
  # index 無しのクエリを投げる実験なので、long_query_time=1 秒をまたぐクエリが連続して出る。
  # 実験中はこのアラームが鳴り続ける。閾値を緩めず、通知を人が無視する運用にしている。→ ADR-0010
  RdsSlowQuerySurgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${EnvName}-rds-slowquery-surge
      AlarmDescription: RDS slow query count surged (>= 5 in 5 minutes)
      Namespace: !Sub ${ProjectName}-${EnvName}/RDS
      MetricName: RdsSlowQueryCount
      Statistic: Sum
      Period: 300
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RdsAlertsTopic
      OKActions:
        - !Ref RdsAlertsTopic

  # --- C: RDS イベント購読 -------------------------------------------------
  # ログにもメトリクスにも出ない「RDS 自体のライフサイクル事象」を拾う。
  # creation / deletion のカテゴリは購読していないので、建て直しのたびには飛ばない。
  # configuration change は RDS の設定を変える cfn-apply のたびに自分にも通知が来るが、
  # 実務と同じ構成を維持する判断。
  RdsEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      SubscriptionName: !Sub ${ProjectName}-${EnvName}-rds-events
      SnsTopicArn: !Ref RdsAlertsTopic
      SourceType: db-instance
      SourceIds:
        - !Ref Database
      Enabled: true
      EventCategories:
        - availability          # 停止・再起動
        - configuration change  # DB 設定変更(ガバナンス用途)
        - failover              # Multi-AZ フェイルオーバー
        - failure               # インスタンス障害
        - low storage           # ストレージ残量逼迫
        - maintenance           # メンテナンスウィンドウでの再起動等

  # ===========================================================================
  # ログの S3 アーカイブ(CloudWatch Logs -> Firehose -> S3)
  # ===========================================================================
  # 【重要】このスタックは撤収のたびに消えるので、アーカイブされたログも毎回全部消える。
  # ライフサイクルの 30 日 / 365 日は一度も発火しない。**保全機能としては動いていない。**
  # 常駐リソースを増やさないこと・Terraform と 1 対 1 に対応させることを優先した意図的な
  # 割り切りで、設計ミスではない。→ docs/adr/0010
  # ===========================================================================
  LogArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${ProjectName}-${EnvName}-logs-archive
      # 監査目的のログなので公開は全面ブロック
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # 128KB 超だけ Glacier IR へ。小さいオブジェクトは移行課金の無駄なので Standard 据え置き
          - Id: transition-large-to-glacier-ir
            Status: Enabled
            ObjectSizeGreaterThan: 131072
            Transitions:
              - StorageClass: GLACIER_IR
                TransitionInDays: 30
          - Id: expire-all
            Status: Enabled
            ExpirationInDays: 365

  # Firehose の「配信エラーの理由」を記録する。これが無いと S3 配信に失敗したときに
  # 原因(IAM / バケット等)を追えない。失敗レコードの退避先(ErrorOutputPrefix)とは別物。
  FirehoseErrorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/kinesisfirehose/${ProjectName}-${EnvName}-logs-archive
      # 運用診断用なので保持は短め。アーカイブ対象ではない(自分自身は Firehose に流さない)
      RetentionInDays: 14

  # ストリームを先に 1 本作っておくことで、Firehose のロールの権限を logs:PutLogEvents だけに
  # 絞れる(自動生成させると logs:CreateLogStream も要る)
  FirehoseErrorLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref FirehoseErrorLogGroup
      LogStreamName: S3Delivery

  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-firehose-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteLogArchive
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt LogArchiveBucket.Arn
                  - !Sub ${LogArchiveBucket.Arn}/*
              - Sid: WriteDeliveryErrors
                Effect: Allow
                Action:
                  - logs:PutLogEvents
                # ロググループの Arn は末尾が :* なので、その配下のログストリームも含む
                Resource: !GetAtt FirehoseErrorLogGroup.Arn

  # CloudWatch Logs が Firehose に流すために引き受けるロール。
  # 配信先が Lambda の場合はリソースベースポリシー(AWS::Lambda::Permission)で許可するので
  # ロールが要らないが、Firehose にはそれが無いのでこちら側でロールを渡す。
  CwlToFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-cwl-to-firehose-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutToFirehose
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutRecords
                Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt LogArchiveDeliveryStream.Arn

  # 圧縮について: CloudWatch Logs は subscription に gzip 圧縮済みで流すため、
  # ここでは展開も再圧縮もせず届いたデータをそのまま置く(CompressionFormat: UNCOMPRESSED)。
  # 展開すると取り込み課金が解凍後のバイト数基準になって割高になる。
  LogArchiveDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub ${ProjectName}-${EnvName}-logs-archive
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        RoleARN: !GetAtt FirehoseRole.Arn
        BucketARN: !GetAtt LogArchiveBucket.Arn
        CompressionFormat: UNCOMPRESSED
        # 低トラフィックでも 1 オブジェクトを大きくするため時間は最大(900 秒)。
        # サイズ 64MB は大量時の上限で、低トラフィックでは時間側が先に効く。
        # 【注意】このスタックは数時間で消えるので、生成されるオブジェクトは数個で、
        # 最後の最大 15 分ぶんは配信前に消える。撤収時の競合対策は cfn-destroy.yml 側。
        BufferingHints:
          IntervalInSeconds: 900
          SizeInMBs: 64
        # 日付パーティション(Athena で読むときのスキャン量を減らす)
        Prefix: "app-logs/!{timestamp:yyyy/MM/dd/}"
        # S3 書き込みに失敗したレコードの退避先
        ErrorOutputPrefix: "errors/!{firehose:error-output-type}/!{timestamp:yyyy/MM/dd/}"
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseErrorLogGroup
          LogStreamName: !Ref FirehoseErrorLogStream

  # 全ログを長期アーカイブへ。FilterPattern が空文字 = 全件マッチ。
  # このロググループには app / db-migrate / db-ops の 3 つが書くので、任意 SQL の
  # 実行結果もアーカイブに含まれる。
  # サブスクリプションフィルタは 1 ロググループあたり 2 本までで、これで 1/2。
  # 残りの 1 本はアプリのエラー通知(Sentry 等)を足すときのために空けてある。
  EcsLogArchiveSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    Properties:
      FilterName: !Sub ${ProjectName}-${EnvName}-ecs-log-to-firehose-archive
      LogGroupName: !Ref EcsLogGroup
      FilterPattern: ""
      DestinationArn: !GetAtt LogArchiveDeliveryStream.Arn
      RoleArn: !GetAtt CwlToFirehoseRole.Arn

# -----------------------------------------------------------------------------
# 出力
# -----------------------------------------------------------------------------
# ワークフローが run-task の networkConfiguration をここから組み立てる。
# Terraform 側はこれを SSM パラメータに書き出して受け渡していたが、
# CloudFormation では describe-stacks で読めるので中継が不要。
#
# Export は付けない。他のスタックから ImportValue されると、
# エクスポート元のスタックを削除できなくなり撤収運用が壊れる。
# -----------------------------------------------------------------------------
Outputs:
  AppUrl:
    Description: アプリの入口
    Value: !Sub https://${EnvName}.${AppSubdomain}.${DomainName}

  LoadBalancerDnsName:
    Description: ALB の DNS 名(DNS 伝播前の切り分けに使う)
    Value: !GetAtt LoadBalancer.DNSName

  ClusterName:
    Value: !Ref Cluster

  # Outputs は Change Set の Changes に現れないので、リソース側で一度問題になった
  # 「毎回 Dynamic になる」現象(→ ScalableTarget の長いコメント)がそもそも起きない場所。
  # 実物から読むぶん、名前の式を写し間違える余地も無い。
  ServiceName:
    Value: !GetAtt Service.Name

  PrivateSubnetIds:
    Description: run-task の networkConfiguration に渡す
    Value: !Sub ${PrivateSubnetA},${PrivateSubnetC}

  EcsSecurityGroupId:
    Description: run-task の networkConfiguration に渡す
    Value: !Ref EcsSecurityGroup

  DbOpsTaskDefinition:
    Description: db-task.yml が run-task するタスク定義(ユーザー作成 / 任意 SQL)
    Value: !Ref DbOpsTaskDefinition

  # 【リビジョン固定の ARN ではなく family 名を返す】
  # !Ref MigrateTaskDefinition はリビジョン付き ARN になるので、構築時のイメージに固定される。
  # パイプラインが新しいイメージで taskdef-migrate.json から register した後も、
  # db-task.yml は古い方を run-task してしまい、古いイメージの Flyway が走る
  # (ecs run-task の containerOverrides に image は無いので回避できない)。
  # family 名を返せば run-task がリビジョン省略として扱い、最新 ACTIVE が使われる。
  # → ADR-0013 の「結果として生じること」2
  MigrateTaskDefinition:
    Description: db-task.yml が run-task するタスク定義の family(Flyway。最新 ACTIVE が使われる)
    Value: !Sub ${ProjectName}-${EnvName}-db-migrate

  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address

  # buildspec.yml が taskdef.json / taskdef-migrate.json の DB_PORT に差し込む。
  # 実際には 3306 だが、他の値と同じく describe-stacks 一発で取れるようにしておく
  DbPort:
    Description: taskdef のプレースホルダに差し込む DB のポート
    Value: !GetAtt Database.Endpoint.Port

  DbMasterSecretArn:
    Description: RDS が作ったマスターパスワードのシークレット(手元から DB に入るときに読む)
    Value: !GetAtt Database.MasterUserSecret.SecretArn

  ImageBucketName:
    Description: 撤収時に空にするバケット
    Value: !Ref ImageBucket

  ImageCdnDomain:
    Value: !GetAtt ImageDistribution.DomainName

  SesIdentity:
    Description: 検証が完了するまでメールは送れない(スタックの成功とは無関係)
    Value: !Ref EmailIdentity

  LogArchiveBucketName:
    Description: 撤収時に空にするバケット(2 つ目)。Firehose が書き続けるので競合対策が要る
    Value: !Ref LogArchiveBucket

  EcsTaskShortageTopicArn:
    Description: ECS の検知の通知先。Chatbot 経由で #njp-alerts-ecs に流れる
    Value: !Ref EcsTaskShortageTopic

  RdsAlertsTopicArn:
    Description: RDS の検知の通知先(ログ / メトリクス / イベントの 3 系統を集約)。#njp-alerts-rds に流れる
    Value: !Ref RdsAlertsTopic

  EcsTaskShortageSlackChannelArn:
    Description: ECS 用の Chatbot チャンネル設定
    Value: !Ref EcsTaskShortageSlackChannel

  RdsAlertsSlackChannelArn:
    Description: RDS 用の Chatbot チャンネル設定
    Value: !Ref RdsAlertsSlackChannel
