AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  アプリのデプロイパイプライン(CodePipeline / CodeBuild)。常駐スタック。

# ============================================================================
# 常駐スタック。app.yml(作り捨て)とは別に建てて、別に消す。
# ============================================================================
# 方針 → docs/adr/0013-app-deploy-with-code-services.md
# 設計 → docs/superpowers/specs/2026-09-05-phase16-codepipeline-design.md
# 適用 → .github/workflows/pipeline-apply.yml / pipeline-destroy.yml
#
# 【なぜ app.yml と分けるのか】
# パイプラインを app.yml の中に置くと鶏と卵になる。スタックを作るには ImageTag が要り、
# そのイメージを作るのはパイプラインで、そのパイプラインはスタックの中にある。
# 実務でもパイプラインは IaC 管理するが、アプリのスタックとは別に置くのが定番で、
# 理由は 3 つとも当てはまる。
#   1. ライフサイクルが違う(環境を作り直してもパイプラインは残るべき)
#   2. 自己参照になる(パイプラインが自分の入っているスタックを更新する形は避けたい)
#   3. CI/CD 基盤と実行環境をアカウントで分ける構成が多い
#
# 【app.yml 側に残るもの】
# CodeDeploy の Application と DeploymentGroup。DeploymentGroup は ALB のリスナー ARN と
# ECS サービスを参照する必要があり、リスナー ARN は生成 ID を含むので予測できないため。
# 逆にここが必要とするのは ApplicationName と DeploymentGroupName という文字列だけなので、
# Export / ImportValue は使わず命名規則で繋ぐ。
#
# 【スタックが無い間もこのパイプラインは存在する】
# その状態で回すと Source と Build は通り、承認待ちで止まる。承認しなければ Deploy に
# 進まないので失敗もしない。これが初回構築のイメージを作る手段になる(→ 設計書の決定20)。

Parameters:
  ProjectName:
    Type: String
  EnvName:
    Type: String
    AllowedValues: [stg, prod]

  # --- ソース ---
  # 【CodeStar Connections は手動で作る常駐リソース】
  # CloudFormation でも作れるが、作った直後は PENDING で、AWS コンソールで GitHub との
  # 握手を人がやるまで AVAILABLE にならない。ADR-0011 の Slack ワークスペース認可と
  # まったく同じ形で、しかも PENDING のままでもスタック作成は成功してしまう。
  # このスタックは pipeline-destroy.yml で消す前提なので、中に入れると建て直すたびに
  # 握手をやり直すことになる。手順 → docs/infrastructure/cloudformation-operations.md
  #
  # 【この値だけ params/pipeline-<env>.json に無い】
  # ARN は arn:aws:codeconnections:<リージョン>:<アカウント ID>:connection/<uuid> の形で、
  # アカウント ID を含む。このリポジトリは public なので、IAM ロールの ARN と同じく
  # GitHub の Environment secret AWS_CODESTAR_CONNECTION_ARN に置き、pipeline-apply.yml が
  # --parameter-overrides で足す(→ docs/infrastructure/github-secrets.md §2-3)。
  ConnectionArn:
    Type: String
    Description: コンソールで作成して握手済みの CodeStar Connections の ARN(Environment secret から渡る)
  FullRepositoryId:
    Type: String
    Description: オーナー/リポジトリ名(例 0000masa/nuxt-java-practice)
  BranchName:
    Type: String
    Default: main

  # --- ビルド ---
  EcrRepositoryName:
    Type: String
  BuildComputeType:
    Type: String
    Default: BUILD_GENERAL1_MEDIUM
    # npm ci と Gradle の依存解決を含むマルチステージビルドなので SMALL では厳しい。
    # ローカルキャッシュはほぼ当たらない前提(→ 設計書 3-6)。
    AllowedValues: [BUILD_GENERAL1_SMALL, BUILD_GENERAL1_MEDIUM, BUILD_GENERAL1_LARGE]
  BuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
  BuildTimeoutMinutes:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 480

  # --- 通知と承認 ---
  # 【Slack のワークスペース ID / チャンネル ID はもう要らない】
  # フェーズ17 で Chatbot をやめ、自作 Slack App に投稿するようになった(→ ADR-0014)。
  # 投稿先は webhook URL が持っているので、テンプレートはチャンネルを知らない。
  #
  # 秘密は 2 つとも SSM の SecureString に置き、Lambda が実行時に読む。
  # CloudFormation の {{resolve:ssm-secure:...}} は Lambda の環境変数では使えないため、
  # ここで渡すのは「パラメータのパス」だけ。
  SsmParameterPath:
    Type: String
    Description: 手動作成した SecureString の置き場(末尾スラッシュあり。例 /nuxt-java-practice/stg/)
    AllowedPattern: ^/.*/$

  # --- その他 ---
  LogRetentionDays:
    Type: Number
    Default: 30
  ArtifactExpirationDays:
    Type: Number
    Default: 30
    Description: アーティファクトは再現可能なので溜め続ける意味がない

Resources:
  # ==========================================================================
  # アーティファクト置き場
  # ==========================================================================
  # pipeline-destroy.yml は delete-stack の前にこれを空にする。空でないバケットが
  # あると 15 分待たされた末に DELETE_FAILED になる(cfn-destroy.yml と同じ理由)。
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub ${ProjectName}-${EnvName}-pipeline-artifacts
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-artifacts
            Status: Enabled
            ExpirationInDays: !Ref ArtifactExpirationDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ==========================================================================
  # CodeBuild
  # ==========================================================================
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ProjectName}-${EnvName}-build
      RetentionInDays: !Ref LogRetentionDays

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-codebuild-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${BuildLogGroup.Arn}:*
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub ${ArtifactBucket.Arn}/*
              # GetAuthorizationToken だけはリソース指定ができない(トークンは
              # レジストリ単位で、リポジトリに紐づかないため)
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}
              # taskdef のプレースホルダに差し込む値をスタックから読む。
              # 初回構築ではスタックがまだ無く、buildspec 側で握り潰して先へ進む
              - Sid: ReadAppStack
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${EnvName}/*
              # migrate 用タスク定義の登録。RegisterTaskDefinition はリソース指定ができない
              - Sid: RegisterMigrateTaskDefinition
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: "*"
              # 【RegisterTaskDefinition だけでは足りない】
              # taskdef-migrate.json に書いたロール ARN を ECS に引き渡す形になるので、
              # iam:PassRole が別に審査される。RegisterTaskDefinition は上のとおり
              # Resource を絞れないため、これが無いと「アカウント内の任意のロールを
              # 指定したタスク定義を作れる」= 権限昇格の経路になる。
              # Condition で渡し先を ECS に限定し、他サービスへの持ち出しも塞ぐ。
              #
              # 【task-role は渡さない】
              # ここが register するのは migrate 用だけで、taskdef-migrate.json は
              # executionRoleArn しか持たない(Flyway を流すだけで AWS API を叩かないため)。
              # アプリ用の taskdef.json は taskRoleArn も持つが、あれを register するのは
              # CodePipeline なので、渡す権利も向こうのロールにある(→ 下の PassTaskRoles)。
              # migrate に taskRoleArn を足すときは、ここにも task-role を追加すること。
              - Sid: PassTaskExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvName}-task-execution-role
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-build
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      TimeoutInMinutes: !Ref BuildTimeoutMinutes
      Source:
        Type: CODEPIPELINE
        # ソースルートからの相対パス(既定は直下の buildspec.yml)。
        # デプロイに使うファイルは deploy/ にまとめてある
        BuildSpec: deploy/buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      # 【ほぼ当たらないと分かったうえで入れている】
      # 同じビルドホストに割り当てられたときだけ効く。AWS 自身が
      # "This is not the best option if your builds are infrequent." と書いており、
      # このリポジトリの使い方はまさにそれ。ただしテンプレート 3 行で外部リソースも
      # 権限も増えないので、当たればラッキーという位置づけで置いておく。
      # なお VPC 設定を入れるとローカルキャッシュは使えなくなる。
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_DOCKER_LAYER_CACHE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref BuildComputeType
        Image: !Ref BuildImage
        # docker build のために Docker デーモンが要る。
        # Docker レイヤーキャッシュも privileged が前提
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
          - Name: ENV_NAME
            Value: !Ref EnvName
          - Name: ECR_REPOSITORY
            Value: !Ref EcrRepositoryName
          # cfn-apply.yml が組み立てるスタック名と同じ規則
          - Name: STACK_NAME
            Value: !Sub ${ProjectName}-${EnvName}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup

  # ==========================================================================
  # CodePipeline
  # ==========================================================================
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-codepipeline-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              # サービス改名(CodeStar Connections → CodeConnections)で IAM の
              # プレフィックスが増えたので両方書く。CLI は codestar-connections のままだが
              # 権限は codeconnections の名前で審査される(gha-cfn-stg の ReadConnection と同じ話)
              - Sid: UseGitHubConnection
                Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Sid: StartBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BuildProject.Arn
              # Deploy アクション(CodeDeployToECS)に必要な最小権限。
              # → CodePipeline のアクションリファレンスに載っている一覧
              - Sid: CodeDeployDeployment
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                Resource: !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${ProjectName}-${EnvName}-app/*
              - Sid: CodeDeployApplication
                Effect: Allow
                Action:
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${ProjectName}-${EnvName}-app
              - Sid: CodeDeployConfig
                Effect: Allow
                Action: codedeploy:GetDeploymentConfig
                Resource: !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*
              # 【アプリのタスク定義を register するのはこのロール】
              # CodeDeployToECS アクションが taskdef.json から新しいリビジョンを作る。
              # CodeBuild ではない(CodeBuild が register するのは migrate 用だけ)
              - Sid: RegisterAppTaskDefinition
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: "*"
              # こちらは taskdef.json を register するので 2 本とも渡す。
              # CodeBuild 側が execution-role だけなのは、あちらが register するのが
              # migrate 用(taskRoleArn を持たない)だけだから
              # 【ecs.amazonaws.com も並べる】
              # タスク定義に書くのは実行ロールとタスクロールで、どちらを引き受けるのも
              # ecs-tasks.amazonaws.com なので、理屈の上ではそれだけで足りるはず。
              # だが CodeDeployToECS アクションの「最小権限」として公式が載せている
              # ポリシーは 2 つとも並べており、しかも本文は ecs-tasks のほうを
              # "You can also add ecs-tasks.amazonaws.com to the list" と後付けで説明している
              # (= 公式の基準は ecs.amazonaws.com のほう)。実機未検証の段階で
              # 公式の最小構成から引き算する理由が無いので、両方書いておく。
              # 渡すロールは 2 本に絞ってあるので、宛先が増えても持ち出せる範囲は広がらない。
              #
              # 上の PassTaskExecutionRole(CodeBuild 側)に足していないのは、あちらが
              # register-task-definition を直接叩くだけで、この公式ポリシーの対象外だから。
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvName}-task-execution-role
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-${EnvName}-task-role
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs.amazonaws.com
                      - ecs-tasks.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-app
      # Triggers は V2 のパラメータ。V1 のまま書くと弾かれる
      PipelineType: V2
      # 既定と同じ。承認待ちのまま新しい push が来たら、後発が先発を追い越す。
      # 古いコミットを承認してしまう事故が起きないほうを取る
      ExecutionMode: SUPERSEDED
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      # 【Triggers を書くと既定の変更検知は無効になる】
      # "When a trigger configuration is specified, default change detection for
      #  repository and branch commits is disabled." と明記されている。
      # したがってここに書いたフィルタが唯一の自動起動条件になる。
      # ソースアクション側に DetectChanges: false は書かない(webhook ごと切れて
      # フィルタも効かなくなる恐れがあるため)。
      #
      # 手動の StartPipelineExecution はこの設定と無関係にいつでも叩けるので、
      # 「フィルタに合う push で自動 + いつでも手動」が両立する。
      #
      # cloudformation/** は入れない。テンプレートの反映は cfn-apply.yml の仕事なので、
      # インフラを直しただけでイメージを作り直す意味がない。
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName
                FilePaths:
                  Includes:
                    - backend/**
                    - frontend/**
                    - docker/**
                    # ビルドコンテキストが `.` なので、除外設定はイメージの中身に効く
                    - .dockerignore
                    # ビルド手順・タスク定義・appspec。環境変数を足したときに
                    # 反映されないと困るので、deploy/ の中身はまるごと対象にする
                    #
                    # 【ここは「リポジトリのパス」】
                    # 下の Deploy アクションの *TemplatePath は「アーティファクト内のパス」で、
                    # 字面が同じ deploy/ でも意味が違う。片方だけ直すと、
                    # エラーは出ないのに自動起動しなくなる
                    - deploy/**
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref FullRepositoryId
                BranchName: !Ref BranchName
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1
              # 【これが無いと buildspec の exported-variables を後続から参照できない】
              # CodeBuild アクションは export された環境変数をすべて変数として産出するが、
              # "If the namespace isn't specified, the variables produced by the action are
              #  not available to be referenced in any downstream action configuration."
              # 名前空間を付けて初めて #{BuildVariables.IMAGE_TAG} と書ける。
              # 名前は任意(コンソールが自動生成するときは BuildVariables になる)。
              # → docs/notes/aws-code-service/env-vars-and-logs.md §4-2
              Namespace: BuildVariables

        # 【この承認は 2 つの役割を兼ねている】
        #   1. 本来の役割: Slack で承認が下りるまでデプロイしない
        #   2. パイプライン作成時に必ず走る初回実行を、ここで止める
        #      (CreatePipeline トリガーの初回実行は無効化できない)
        # 承認しなければ Deploy に進まないので、スタックがまだ無くても失敗しない。
        # これが初回構築のイメージを作る手段になる(→ 設計書の決定20)
        - Name: Approve
          Actions:
            - Name: Approve
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                # 通知は NotificationRule 経由で Chatbot に届くので、
                # ここに NotificationArn(SNS)は指定しない
                #
                # 【#{...} は CodePipeline の変数、${...} は !Sub】
                # 展開する主体が違うので混在させられる。#{BuildVariables.IMAGE_TAG} は
                # Build アクションの Namespace: BuildVariables と buildspec の
                # exported-variables で決まる(片方でも欠けると解決されない)。
                # イメージタグを出しておかないと「どのコミットを承認しようとしているのか」が
                # 分からないまま押すことになる。→ docs/notes/aws-code-service/env-vars-and-logs.md §4-2
                CustomData: !Sub "${ProjectName} (${EnvName}) をデプロイします。イメージ: #{BuildVariables.IMAGE_TAG} / push: #{BuildVariables.IMAGE_PUSHED}。承認するとこのイメージが本番のリスナーに切り替わります。"
              RunOrder: 1

        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                # app.yml(作り捨て)にある CodeDeploy のリソースを名前で参照する。
                # スタックが無ければここで失敗するが、それは正しい失敗
                ApplicationName: !Sub ${ProjectName}-${EnvName}-app
                DeploymentGroupName: !Sub ${ProjectName}-${EnvName}-app-dg
                # buildspec.yml がプレースホルダを埋めて出したものを使う。
                # Image1ArtifactName / Image1ContainerName は指定しない
                # (どちらも Required: No。イメージ URI は buildspec が直接書き込むので
                #  imageDetail.json 経由の差し込みが要らない)
                #
                # 【*TemplatePath は「アーティファクト内のパス」。リポジトリのパスではない】
                # 中身を決めているのは deploy/buildspec.yml の artifacts.files で、
                # base-directory を付けていないので deploy/ 付きのまま梱包される。
                # 置き場を動かすときは、あちらと必ず対で直すこと
                TaskDefinitionTemplateArtifact: BuildArtifact
                TaskDefinitionTemplatePath: deploy/taskdef.json
                AppSpecTemplateArtifact: BuildArtifact
                AppSpecTemplatePath: deploy/appspec.yaml
              InputArtifacts:
                - Name: BuildArtifact
              RunOrder: 1

  # ==========================================================================
  # Slack への通知と、Slack からの承認
  # ==========================================================================
  # 方針 → docs/adr/0014-slack-approval-with-lambda.md(ADR-0011 / ADR-0013 を一部変更)
  # 手順 → docs/slack/README.md §6
  #
  # 【フェーズ17 で Chatbot をやめた】
  # 承認そのものは Chatbot でもできたが、1 クリックで完結せず(トークンが通知変数に
  # 無い)、Get info / Start Pipeline という押しても AccessDenied になる既製ボタンが
  # 消せず、カスタムアクションは全通知に付いてしまった。**承認者はアプリ開発担当**なので
  # 「押していいものが一目で分かる」ことを優先し、自作 Slack App に切り替えた。
  # やめた方式の記録 → docs/notes/aws-code-service/chatbot-approval-attempt.md
  #
  # 【アラート 2 本(app.yml)は Chatbot のまま】
  # あちらは作り捨てスタックにあり、Lambda を持ち込むと環境を建て直すたびに
  # 作り直しになる。ボタンの問題も承認チャンネル固有なので、混在を選んだ。
  PipelineNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${EnvName}-pipeline-notifications
      DisplayName: pipeline

  # CodeStarNotifications が publish できるようにする。
  # aws:SourceAccount を付けているのは、他アカウントのルールから撃ち込まれないため
  PipelineNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref PipelineNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCodeStarNotifications
            Effect: Allow
            Principal:
              Service: codestar-notifications.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineNotificationTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # --------------------------------------------------------------------------
  # 通知を Slack に投げる Lambda
  # --------------------------------------------------------------------------
  # コードは lambda/slack-approval/notify/。ローカルパスのまま書いてあり、
  # pipeline-apply.yml の `aws cloudformation package` が zip 化して S3 に上げ、
  # Code を S3Bucket/S3Key に書き換えたテンプレートを吐く(→ ADR-0014)。
  #
  # 【置き場はテンプレート置き場とは別のバケット】
  # nuxt-java-practice-lambda-artifacts-<アカウントID>/slack-approval/<ハッシュ>。
  # テンプレートは CloudFormation が中身を写し取るので S3 の実体が消えても困らないが、
  # zip はスタックが S3Key という「在り処」しか持たないため、消えるとロールバックが失敗する。
  # 保存要件が正反対なので、ライフサイクルが届かないよう置き場ごと分けてある(→ 手順書 §3-2)。
  NotifyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${EnvName}-slack-notify
      RetentionInDays: !Ref LogRetentionDays

  NotifyFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-slack-notify-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: notify
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${NotifyLogGroup.Arn}:*
              # 【承認の権限は持たせない】
              # この関数は投稿するだけ。承認できるのは Function URL を持つ
              # InteractionFunction だけ、という切り分けにしてある。
              # 読むのは「どのコミットを承認しようとしているのか」を出すためだけ
              - Sid: ReadExecution
                Effect: Allow
                Action: codepipeline:GetPipelineExecution
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${EnvName}-app
              # webhook URL を実行時に読む。CloudFormation の {{resolve:ssm-secure}} は
              # Lambda の環境変数では使えないので、パス名だけ渡して自分で取りに行く
              #
              # 【kms:Decrypt は要らない】
              # SecureString なので WithDecryption: true を付けており、SSM は呼び出し元
              # (このロール)の身分のまま KMS の Decrypt を呼ぶ。それでも IAM 側に
              # kms:Decrypt を書かなくていいのは、既定の aws/ssm キーのキーポリシーが
              # 「同じアカウントの主体が SSM 経由で復号すること」を直接許しているから
              # (Principal: "*" に kms:CallerAccount と kms:ViaService の条件が付いた形)。
              # 要るのは SecureString をカスタマーマネージドキーで作ったときで、
              # そのキーのポリシーは IAM に委譲する形が既定なので明示が必要になる。
              # → app.yml の SsmSecureStrings(タスク実行ロール)と同じ判断
              - Sid: ReadWebhookUrl
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}slack_webhook_url

  NotifyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${EnvName}-slack-notify
      Role: !GetAtt NotifyFunctionRole.Arn
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 15
      # 【AWS SDK v3 は runtime が持っている】
      # nodejs18.x 以降は同梱されているので npm install もバンドラも要らない。
      # zip は .mjs を固めるだけ。代償として SDK のバージョンは AWS 任せになる
      Code: ../lambda/slack-approval/notify
      LoggingConfig:
        LogGroup: !Ref NotifyLogGroup
      Environment:
        Variables:
          SLACK_WEBHOOK_URL_PARAM: !Sub ${SsmParameterPath}slack_webhook_url

  NotifySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref PipelineNotificationTopic
      Protocol: lambda
      Endpoint: !GetAtt NotifyFunction.Arn

  NotifyInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt NotifyFunction.Arn
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref PipelineNotificationTopic

  # --------------------------------------------------------------------------
  # Slack のボタン押下を受ける Lambda(公開エンドポイント)
  # --------------------------------------------------------------------------
  InteractionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${EnvName}-slack-interaction
      RetentionInDays: !Ref LogRetentionDays

  InteractionFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${EnvName}-slack-interaction-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: interaction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${InteractionLogGroup.Arn}:*
              # 【承認できるのはこのロールだけ】
              # Chatbot 方式の GuardrailPolicies が持っていた 3 つのうち、実際に使う 2 つ。
              #
              # 【2 つは ARN の粒度が違う。1 文にまとめると落ちる(実際に踏んだ)】
              # CodePipeline の ARN は用途によって階層が変わる。
              #   パイプライン   arn:aws:codepipeline:<region>:<account>:<pipeline>
              #   アクション     arn:aws:codepipeline:<region>:<account>:<pipeline>/<stage>/<action>
              # GetPipelineState はパイプライン単位だが、**PutApprovalResult は
              # アクション単位**で審査される。パイプラインの ARN だけを書くと
              # 「.../nuxt-java-practice-stg-app/Approve/Approve on ... is not authorized」
              # になる。ステージ名とアクション名まで含めて初めて一致する。
              - Sid: ReadPipelineState
                Effect: Allow
                Action: codepipeline:GetPipelineState
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${EnvName}-app
              # /* にしているのはステージ名・アクション名を IAM に写さないため。
              # 対象はこのパイプライン 1 本に固定されており、そもそも
              # PutApprovalResult が意味を持つのは手動承認アクションだけなので広がらない
              - Sid: Approve
                Effect: Allow
                Action: codepipeline:PutApprovalResult
                Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${EnvName}-app/*
              # kms:Decrypt を持たせない理由は notify 側と同じ(既定の aws/ssm キー)
              - Sid: ReadSigningSecret
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPath}slack_signing_secret

  InteractionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${EnvName}-slack-interaction
      Role: !GetAtt InteractionFunctionRole.Arn
      Runtime: nodejs22.x
      Handler: index.handler
      # Slack は 3 秒で応答を期待する。AWS API 2 本ぶんの余裕として 10 秒
      Timeout: 10
      # 【叩かれ続けても課金が青天井にならないようにする】
      # Function URL は AuthType: NONE で公開されている。署名検証で中身は守れるが、
      # 呼び出しそのものは止められない。同時実行数に上限を置いて被害を面積で抑える。
      # API Gateway を挟めばレート制限も WAF も付けられるが、リソースが増えるので採らない
      ReservedConcurrentExecutions: 5
      Code: ../lambda/slack-approval/interaction
      LoggingConfig:
        LogGroup: !Ref InteractionLogGroup
      Environment:
        Variables:
          SLACK_SIGNING_SECRET_PARAM: !Sub ${SsmParameterPath}slack_signing_secret

  # 【AuthType: NONE は「認証しない」であって「無防備」ではない】
  # Slack は IAM 署名を付けられないので、AWS 側の認証は使えない。
  # 代わりに Slack の署名を関数の中で検証している(lambda/.../verify.mjs)。
  # ここを IAM にすると Slack からのリクエストが全部 403 になる
  InteractionFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt InteractionFunction.Arn
      AuthType: NONE

  # 【Lambda は「URL があること」と「呼んでいいこと」を別に審査する】
  # 上の AWS::Lambda::Url が決めるのは URL を生やすことだけ。呼び出しの可否は
  # 関数のリソースベースポリシーで別に決まるので、この許可が無いと
  # URL は出来ているのに 403 が返る。しかも FunctionUrlAuthType を Url 側と
  # 揃えないと、この文があっても対象外になって同じく 403 になる。
  # (コンソールで Function URL を作ると裏でこの文が自動で足される。
  #  CloudFormation では自分で書く)
  #
  # 【Principal が "*" なのは、呼び出し元に名前が付かないから】
  # Principal に書けるのは AWS の主体だけで、AWS が主体を識別できるのは
  # SigV4 署名が付いたリクエストだけ。Slack が投げるのは素の HTTPS POST で、
  # 署名は独自の X-Slack-Signature ヘッダなので AWS から見ると匿名になる。
  # NotifyInvokePermission のように sns.amazonaws.com と書く相手がいない。
  #
  # 【アクションは 2 つ要る。片方だけだと 403 になる(実際に踏んだ)】
  # lambda:InvokeFunctionUrl だけでは足りず、lambda:InvokeFunction も要る。
  # 足りないと URL は出来るのにすべて 403 Forbidden になり、しかも関数が
  # 1 度も起動しないので CloudWatch Logs にも何も残らない。原因が見えにくい。
  # **コンソールの関数ページが「2 つ付与せよ」と警告してくれる**ので、迷ったらそこを見る。
  # AWS::Lambda::Permission は Action を 1 つしか取れないのでリソースを 2 つに分ける。
  #
  # 【2 文目に FunctionUrlAuthType は付けられない】
  # 付けると "FunctionUrlAuthType is only supported for lambda:InvokeFunctionUrl action"
  # で作成に失敗する(これも実際に踏んだ)。条件キーで縛れるのは 1 文目だけ。
  #
  # 【結果として 2 文目は広い。そのうえで受け入れている】
  # 条件が付けられないので、2 文目は「任意の AWS プリンシパルがこの関数を Invoke できる」
  # という意味になる。狭める手段が無いため、次の 2 つで実害を抑える方針を採る。
  #   1. **署名検証(verify.mjs)が本体の防御。** 呼べても承認はできず 401 で終わる
  #   2. **ReservedConcurrentExecutions: 5** で費用と影響範囲に上限を置く
  # → ADR-0014 の「結果として生じること」に代償として記録した。
  InteractionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt InteractionFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  InteractionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt InteractionFunction.Arn
      Action: lambda:InvokeFunction
      Principal: "*"

  # 【フェーズ17 で宛先を Chatbot から SNS に変えた】
  # CodeStarNotifications は Chatbot のチャンネル設定を直接指せる(AWSChatbotSlack)が、
  # 整形を自前でやる以上、間に SNS を挟んで Lambda に渡す形になる。
  # アラート系(app.yml)が SNS を挟むのは CloudWatch アラームの制約が理由だったが、
  # こちらは「Lambda を起動したいから」という別の理由で同じ形になった。
  PipelineNotificationRule:
    Type: AWS::CodeStarNotifications::NotificationRule
    # 【Resource を静的な文字列にしたので、依存を自分で書く】
    # CreateNotificationRule は Resource のパイプラインが実在するか検証する。
    # 下のとおり ARN を !Sub の固定文字列にしたため参照が無く、暗黙の依存も無い。
    # 書かないと NotificationRule が Pipeline より先に作られ、
    # 「Invalid request provided」で落ちる(実際に踏んだ)。
    # app.yml の ScalableTarget が静的な ResourceId だった頃と同じ形。
    DependsOn: Pipeline
    Properties:
      Name: !Sub ${ProjectName}-${EnvName}-pipeline
      DetailType: FULL
      # 【!GetAtt Pipeline.Arn ではなく静的な文字列にする】
      # ARN 自体は !GetAtt Pipeline.Arn で取れる(Ref は名前を返すので使えない)。
      # だが Resource は createOnly(Update requires: Replacement)で、Pipeline は
      # Stages や Triggers を直すたびに更新対象に入る。更新対象への GetAtt は
      # Change Set で解決されない(Evaluation: Dynamic)ため、このルールに
      # Replacement: Conditional が付き、そのたびに allow_replacement=true が要る。
      # パイプライン名は固定文字列なので、同じものを直接書いて静的に確定させる。
      # → app.yml の ScalableTarget / CodeDeployDeploymentGroup と同じ理由。
      # 下の Targets が !Ref のままなのは、あちらが更新可能なプロパティだから。
      Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${EnvName}-app
      EventTypeIds:
        # 承認まわり。needed が「Slack で承認してください」の本体
        - codepipeline-pipeline-manual-approval-needed
        - codepipeline-pipeline-manual-approval-succeeded
        - codepipeline-pipeline-manual-approval-failed
        # 失敗を見逃さないための通知。CodeDeploy のロールバックもここに出る
        - codepipeline-pipeline-pipeline-execution-failed
        - codepipeline-pipeline-action-execution-failed
        # 締めの 1 通。これが来たらデプロイは終わっている
        - codepipeline-pipeline-pipeline-execution-succeeded
      Targets:
        - TargetType: SNS
          TargetAddress: !Ref PipelineNotificationTopic

Outputs:
  PipelineName:
    Value: !Ref Pipeline

  PipelineConsoleUrl:
    Description: 承認や実行状況を見る画面
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}

  BuildProjectName:
    Value: !Ref BuildProject

  ArtifactBucketName:
    Description: pipeline-destroy.yml が空にするバケット
    Value: !Ref ArtifactBucket

  # 【この URL を Slack App の Interactivity に登録する】
  # スタックを作るまで URL は決まらないので、手順は
  # 「Slack App を作る → デプロイ → URL を登録」の 3 段になる(→ docs/slack/README.md §6-3)
  SlackInteractionUrl:
    Description: Slack App の Interactivity Request URL に設定する値
    Value: !GetAtt InteractionFunctionUrl.FunctionUrl
