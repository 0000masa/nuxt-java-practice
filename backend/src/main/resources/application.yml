spring:
  application:
    name: app
  datasource:
    # アプリの接続は Writer と Reader の 2 つのプールに分かれる(組み立ては config/DataSourceConfig → docs/adr/0016)。
    # ここ(spring.datasource.*)が Writer。Reader は下の app.datasource.reader で、URL だけが違う。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:app}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:password}
    hikari:
      pool-name: writer
      # 固定サイズのプールにする(minimum-idle を書かない = maximum-pool-size と同じ。HikariCP の推奨)。
      # 起動した時点でこの本数を張り、使っていなくても持ち続ける。
      # 値は Aurora の max_connections(db.t4g.medium は 90)から逆算する。Blue/Green デプロイ中は
      # 旧タスクと新タスクが同時にプールを持つので、既定の 10 だと prod で上限を超える
      # → docs/superpowers/specs/2026-09-13-phase19-aurora-design.md の決定9
      maximum-pool-size: ${DB_WRITER_POOL_SIZE:5}
  flyway:
    # 開発は起動時にマイグレーションする(既定)。
    # AWS では ECS サービスを false にし、専用の Run Task(SPRING_MAIN_WEB_APPLICATION_TYPE=none)だけが
    # true で起動して DDL 権限を持つ migrate ユーザーで流す。理由 → docs/adr/0005
    enabled: ${FLYWAY_ENABLED:true}
    # url を書くと、Flyway はアプリの DataSource を使わず、url / user / password から
    # 非プールの DataSource を自分で作る(FlywayAutoConfiguration#getMigrationDataSource)。
    # 書かないと、user が設定されているときアプリの DataSource から URL を引き継ごうとするが、
    # アプリの DataSource は Writer / Reader を振り分けるプロキシ(config/DataSourceConfig)で URL を持っていない。
    # DDL は Writer にしか通らないので、Writer の URL を明示する。
    url: ${spring.datasource.url}
    # 接続に使うユーザーを datasource と別にできる。AWS では Run Task 側に migrate ユーザーを渡す。
    # 既定は datasource と同じ値なので、開発では接続先も接続ユーザーも変わらない。
    user: ${FLYWAY_DB_USER:${DB_USER:app}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:password}}
  jpa:
    hibernate:
      ddl-auto: validate # スキーマは Flyway(db/migration)が管理。エンティティとの不一致は起動時エラーで検出する
    open-in-view: false # ビュー描画中の遅延ロードを禁止し、DB アクセスを Service 層に閉じる
  data:
    redis:
      # セッションの保存先(→ docs/adr/0015)。開発は docker-compose の redis、本番は ElastiCache。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 開発の Redis は認証なしなので空。本番は SSM SecureString から AuthToken が入る。
      # 空文字を渡すと AUTH コマンドを送らない(= 認証なし)挙動になる。
      password: ${REDIS_PASSWORD:}
      ssl:
        # 本番は ElastiCache の TransitEncryptionEnabled: true に合わせて true。
        # 開発の redis コンテナは平文なので false。
        enabled: ${REDIS_SSL:false}
  session:
    # 未操作でセッションが切れるまでの時間。Redis のキーに TTL として設定される。
    # 切れる挙動を試したいときは docker compose exec redis redis-cli で
    # DEL 'spring:session:sessions:<id>' するか、FLUSHALL で全部消す
    timeout: 1d
    # キーが spring.session.data.redis なのは Boot 4 から。
    # 記事でよく見る spring.session.redis.* は 4.0.0 で deprecated(level: error)になっており、
    # 書いても黙って無視される。無視された結果どうなるかは下のとおり(実測で踏んだ)。
    data:
      redis:
        # 既定の RedisSessionRepository は FindByIndexNameSessionRepository を実装していないため、
        # findByPrincipalName を使う UserSessionManager の DI が解決できず起動に失敗する。
        #   Parameter 0 of constructor in com.example.app.auth.UserSessionManager
        #   required a bean of type 'org.springframework.session.FindByIndexNameSessionRepository'
        # indexed にすると RedisIndexedSessionRepository になり、principal 名の索引が作られる
        # (→ docs/adr/0015、docs/notes/redis/session-management.md)。
        repository-type: indexed
        # 期限切れセッションの掃除は Redis の TTL とキースペース通知に任せる。
        # ただし TTL はキー単位なので、principal 索引(SET)に残ったセッション ID は
        # 通知を受けて SREM する必要がある。そのため Redis 側に
        # notify-keyspace-events Egx の設定が要る(docker-compose.yml / ElastiCache のパラメータグループ)。
        #
        # 既定の notify-keyspace-events は、起動時にアプリが CONFIG GET / CONFIG SET で
        # その設定を自分で入れにいく。ElastiCache は CONFIG コマンドを受け付けないので、
        # 既定のままだと起動に失敗する(AWS で踏んだ。ローカルの素の Redis では通るので気づけない)。
        #   ERR unknown command 'CONFIG', with args beginning with: 'GET' 'notify-keyspace-events'
        # 設定は Redis 側に持たせてあるので、アプリからは触らない。
        # 代わりに Redis 側の設定が外れても起動は成功し、索引の掃除だけが黙って止まる点に注意
        # (→ docs/notes/redis/session-management.md §12)。
        configure-action: none
  security:
    oauth2:
      client:
        registration:
          google:
            # 資格情報が無くても起動できるようダミーを既定値にしている(設計の決定13)。
            # 空文字だと ClientRegistration を作れず起動に失敗し、クローンしただけの人・
            # @SpringBootTest・CI が全部止まるため。実際に使うには .env に本物を入れる
            # → docs/setup/google-oauth.md
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            # 既定値は {baseUrl}/login/oauth2/code/{registrationId} だが、{baseUrl} は
            # リクエストの Host から組み立てられる。Nuxt の devProxy は changeOrigin: true なので
            # Host が backend:8080 になり、Google に登録した URI と一致せず redirect_uri_mismatch になる。
            # 本番も ALB が TLS を終端するので https にならない。APP_BASE_URL から作れば
            # 「Google Console に登録する文字列」と「アプリの設定値」が常に同一になる(決定9)。
            redirect-uri: ${APP_BASE_URL:http://localhost:3000}/api/login/oauth2/code/google
            # スコープ・各エンドポイント・ユーザー情報の取り出し方は Spring Security が
            # CommonOAuth2Provider.GOOGLE として持っているので書かない(openid / profile / email)
  mail:
    host: ${SMTP_HOST:localhost} # 開発は Mailpit、本番は SES
    port: ${SMTP_PORT:1025}
server:
  port: 8080
management:
  health:
    # メールのヘルス指標を切る。理由は 2 つ。
    #  1. 有効だと集約の /api/actuator/health を叩くたびに SMTP 接続を試みる。本番の送信経路は
    #     SES の API なので、そもそも意味のある確認にならない
    #  2. @SpringBootTest のコンテキストで mailHealthContributor の生成が
    #     'beans' must not be empty で失敗し、テスト 3 本が落ちた(実測)。
    #     指標を作る側が具象型 JavaMailSenderImpl で Bean を探すのに対し、AuthFlowTest が
    #     @MockitoBean JavaMailSender で差し替えたモックはインターフェースの実装でしかないため
    #     0 件になる → docs/notes/java/spring/mail-sending-and-transport-switching.md
    mail:
      enabled: false
  endpoints:
    web:
      # 既定は /actuator だが、フロントは SSG の静的ファイルとして配信されるので
      # 「/api 配下が API」という取り決め(設計概要のアーキテクチャ決定4)に合わせる。
      # SPA フォールバック(StaticResourceConfig)が /api を除外しているのも同じ理由で、
      # ここを /api の外に出すと未マッチ時に HTML が返ってしまう。
      base-path: /api/actuator
      exposure:
        include: health # health だけ公開する。env / beans / configprops などは出さない
  endpoint:
    health:
      # 応答は status だけ。DB のホスト名やバージョンを外に出さない
      show-details: never
      # ALB のヘルスチェックには liveness(DB を含まない)を使う。
      # DB を含む health をヘルスチェックに使うと、RDS が一時的に落ちたときに
      # 全タスクが unhealthy になって入れ替わり続ける → docs/superpowers/specs/2026-08-19-phase13 の決定6
      group:
        liveness:
          include: ping
        readiness:
          include: db
# アプリ固有の設定(型付きで受け取る → config/AppProperties)
app:
  base-url: ${APP_BASE_URL:http://localhost:3000} # メール本文のリンクの組み立てに使う
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    # smtp(開発の Mailpit)か ses(本番)。実体の切り替えは config/MailSenderConfig
    transport: ${MAIL_TRANSPORT:smtp}
  # Reader 用の接続プール(config/DataSourceConfig が読む。AppProperties には入れていない)。
  # ユーザーとパスワードは spring.datasource と同じで、URL だけが違う。
  datasource:
    reader:
      # 本番は Aurora の Reader エンドポイント(taskdef が DB_READER_HOST を渡す)。
      # 開発とテストは DB_READER_HOST を設定しないので DB_HOST と同じ MySQL に繋ぐ
      url: jdbc:mysql://${DB_READER_HOST:${DB_HOST:localhost}}:${DB_PORT:3306}/${DB_NAME:app}
      hikari:
        pool-name: reader
        maximum-pool-size: ${DB_READER_POOL_SIZE:5} # 固定サイズにする理由は spring.datasource.hikari と同じ
        # LazyConnectionDataSourceProxy は Reader から借りた接続に setReadOnly(true) を呼ばないので、
        # プールの既定として読み取り専用にしておく。これが無いと、Reader が同じ MySQL を指す開発環境では
        # 読み取り専用トランザクション内の書き込みが素通りし、振り分けの誤りに気づけない。
        # 仕組み: HikariCP がプールに入れる接続を作るたびに setReadOnly(true) を呼び、ドライバ(Connector/J)が
        # MySQL に SET SESSION TRANSACTION READ ONLY を送る。以後その接続での書き込みは MySQL が
        # ERROR 1792(Cannot execute statement in a READ ONLY transaction)で拒否する
        read-only: true
  # app.task(タスクモード)は<b>ここに書かない</b>。
  # 環境変数 APP_TASK だけで与える。ここに task: ${APP_TASK:} と書くと、未指定でも
  # 「空文字のプロパティが存在する」状態になり、config/TaskRunner の
  # @ConditionalOnProperty("app.task") が成立して通常起動でも即終了してしまう
  # (@ConditionalOnProperty は「値が false 以外なら成立」する判定なので、空文字も成立扱い)。
  # 取りうる値: migrate。フェーズ9 で seed を足す。
