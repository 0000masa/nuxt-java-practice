# 開発環境(設計は docs/development/README.md を参照)
# 接続情報などの値はリポジトリ直下の .env で一元管理する(cp .env.example .env で作成)
# - backend: env_file で .env を丸ごと注入
# - mysql / minio / minio-init: 必要な値だけ ${...} で参照(compose が .env を自動で読む)
# 本番は ECS タスク定義側で別の値を注入する
services:
  nuxt:
    build: ./docker/frontend
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000" # Nuxt dev サーバー(開発時の入口)
    depends_on:
      - backend

  backend:
    build: ./docker/backend
    volumes:
      - ./backend:/app
      - gradle-cache:/root/.gradle # Gradle 本体と依存ライブラリのキャッシュ(再ダウンロード防止)
    ports:
      - "8080:8080" # Spring Boot(/api)
    env_file:
      - .env # 変数が増えても .env に追記するだけでよい
    depends_on:
      mysql:
        condition: service_healthy # MySQL が応答できるようになってから起動する
      redis:
        condition: service_healthy # Spring Session(indexed)は起動時にキースペース通知を購読しに行くので、待たないと起動に失敗する
      elasticmq:
        condition: service_started # 認証メールの依頼を送る先

  # 認証メールのワーカー。backend と同じソースを、役割だけ変えて動かす(APP_ROLE=worker)。
  # 本番の ECS で 2 つのサービスに分けるのと同じ形にして、ワーカーだけを止める・戻すを試せるようにしている
  # (docker compose stop worker → 登録しても届かず、キューに溜まる → start で流れる)。
  # → docs/superpowers/specs/2026-10-11-phase20-sqs-auth-mail-design.md の決定20
  worker:
    build: ./docker/backend
    volumes:
      - ./backend:/app
      # Gradle のキャッシュは backend と分ける。共有すると、ロックを持つ相手(別コンテナの Gradle)と
      # localhost 越しに調整できず、「Timeout waiting to lock journal cache」で起動に失敗する(実測)
      - gradle-cache-worker:/root/.gradle
    # プロジェクト側のキャッシュ(/app/.gradle)も backend と分ける。理由は上と同じ
    command: ["sh", "./gradlew", "bootRun", "--project-cache-dir", "/tmp/gradle-project-cache"]
    # ポートは公開しない。本番のワーカーも ALB に繋がず、外から HTTP を受けない
    env_file:
      - .env
    environment:
      APP_ROLE: worker
      # マイグレーションは backend が流す。本番も ECS サービスは Flyway を走らせない
      FLYWAY_ENABLED: "false"
      # 受信スレッドは 1 本なので、Writer の接続は 2 本で足りる(決定18)
      DB_WRITER_POOL_SIZE: "2"
    depends_on:
      backend:
        condition: service_started # Flyway(backend が流す)より先に読みに行かないよう、backend の後に起動する
      elasticmq:
        condition: service_started

  mysql:
    image: mysql:8
    environment:
      # 公式イメージが決めた変数名しか受け取れないので、.env の値を個別にマッピングする
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306" # ホストの GUI クライアント等から直接接続できるように公開
    volumes:
      - mysql-data:/var/lib/mysql # named volume で永続化(down してもデータが残る)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # セッションの保存先(→ docs/adr/0015)。本番は ElastiCache。
  # 公式イメージに GUI は入っていないので、GUI は下の redisinsight が別コンテナで担当する。
  redis:
    image: redis:7 # ElastiCache の Redis OSS が 7.1 で止まっているのでメジャーを揃える(→ docs/notes/redis/elasticache.md)
    command: >
      redis-server
      --appendonly yes
      --notify-keyspace-events Egx
    # --appendonly yes: 追記型ログで永続化する。down してもログイン状態とキーが残る
    # --notify-keyspace-events Egx: 期限切れ・削除をイベントで通知する。
    #   これが無いと、TTL で消えたセッションの ID が principal 索引(SET)に残り続ける。
    #   TTL はキー単位で、SET の要素ごとには張れないため(→ docs/notes/redis/session-management.md)
    ports:
      - "6379:6379" # ホストの redis-cli や GUI から直接繋げるように公開
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # テスト専用の Redis。gradlew test は build.gradle の REDIS_HOST でこちらに向く。
  # 開発用と分けるのは、@SpringBootTest がログインを実際に通すため、
  # 同じ Redis を使うと GUI で観察中のキーにテスト由来のセッションが混ざるから。
  # 永続化しない(volume なし)が、通知の設定は本番・開発と揃える。
  redis-test:
    image: redis:7
    command: redis-server --notify-keyspace-events Egx
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis の中身をブラウザで見る GUI。開発専用で、本番に対応するものは無い。
  # 接続先は初回にブラウザから登録する(Host: redis / Port: 6379)→ docs/notes/redis/session-management.md
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540" # ブラウザで http://localhost:5540
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      # backend が使う S3 用の認証情報(.env)と同じ値を MinIO 側にも設定する
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000" # S3 互換 API
      - "9001:9001" # 管理画面(ブラウザで http://localhost:9001)
    volumes:
      - minio-data:/data

  # バケット自動作成の一発ジョブ: images バケットを作って終了する
  # --ignore-existing により既にあれば何もしない(何度 up しても安全)
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET};
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP(アプリからの送信先)
      - "8025:8025" # Web UI(ブラウザで http://localhost:8025)

  # SQS の代わり(本番は Amazon SQS)。キューは起動時に設定ファイルから作られる → docker/elasticmq/elasticmq.conf
  # 中身はホストから AWS CLI で覗ける(例: aws --endpoint-url http://localhost:9324 sqs receive-message ...)
  # 手順 → docs/notes/sqs/local-observation.md
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9324:9324" # SQS 互換 API

volumes:
  mysql-data:
  minio-data:
  redis-data: # Redis の AOF。redis-test には付けない(テストのデータは残さない)
  redisinsight-data: # GUI に登録した接続先の設定
  gradle-cache:
  gradle-cache-worker: # worker 用。backend と共有するとロックがぶつかる(worker のコメント参照)
